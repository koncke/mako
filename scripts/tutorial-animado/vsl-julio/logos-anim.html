<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:transparent}canvas{display:block}
.probe{font-family:'Geist';font-weight:700;position:absolute;left:-9999px}</style></head>
<body><span class="probe">MaKo Google Video</span><canvas id="c"></canvas>
<script>
var PARAMS=new URLSearchParams(location.search);
window.MAKO_STYLE = PARAMS.get('mako')||'badge';   // 'badge' | 'white'
window.LOGO_STYLE = PARAMS.get('cards')==='0'?'plain':'card';

// ===== logos (se cargan de ../logos2). name=archivo, label=texto. =====
var LOGOS = [
  {name:'youtube',  label:'YouTube'},
  {name:'gmail',    label:'Gmail'},
  {name:'meet',     label:'Google Meet'},
  {name:'whatsapp', label:'WhatsApp'},
  {name:'claude',   label:'Claude'},
  {name:'calendly', label:'Calendly'},
  {name:'docs',     label:'Google Docs'},
  {name:'meta',     label:'Meta'},
  {name:'panda',    label:'Panda Video'},
  {name:'sheets',   label:'Google Sheets'}
];
// posiciones 16:9 alrededor del hombre (centro libre) -> fracciones de W,H
var POS = [
  [0.260,0.160], // youtube  (arriba-izq)
  [0.380,0.860], // gmail     (abajo-izq, cerca del laptop) -- ya NO sobre la cabeza
  [0.740,0.160], // meet      (arriba-der)
  [0.120,0.335], // whatsapp  (izq-alto)
  [0.130,0.585], // claude    (izq-medio)
  [0.880,0.335], // calendly  (der-alto)
  [0.880,0.585], // docs      (der-medio)
  [0.200,0.800], // meta      (izq-bajo)
  [0.620,0.860], // panda     (abajo-der, cerca del laptop)
  [0.800,0.800]  // sheets    (der-bajo)
];

// ---- carga + recorte del padding transparente ----
var TR = {};
function trimImg(img){
  var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  var oc=document.createElement('canvas'); oc.width=w; oc.height=h;
  var octx=oc.getContext('2d'); octx.drawImage(img,0,0);
  var data; try{ data=octx.getImageData(0,0,w,h).data; }catch(e){ return {canvas:oc,w:w,h:h}; }
  var minX=w,minY=h,maxX=-1,maxY=-1;
  for(var y=0;y<h;y++){ var row=y*w; for(var x=0;x<w;x++){ if(data[(row+x)*4+3]>18){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; } } }
  if(maxX<0) return {canvas:oc,w:w,h:h};
  var tw=maxX-minX+1, th=maxY-minY+1;
  var tc=document.createElement('canvas'); tc.width=tw; tc.height=th;
  tc.getContext('2d').drawImage(oc,minX,minY,tw,th,0,0,tw,th);
  return {canvas:tc,w:tw,h:th};
}
window.assetsReady = Promise.all(LOGOS.map(function(L){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){ try{ TR[L.name]=trimImg(im); }catch(e){} res(); };
    im.onerror=function(){ res(); };
    im.src='../logos_real/'+L.name+'.png';
  });
}));

// ===== helpers =====
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function sparkle(ctx,cx,cy,r,color){var k=r/11;ctx.save();ctx.translate(cx,cy);ctx.scale(k,k);ctx.beginPath();ctx.moveTo(0,-11);ctx.bezierCurveTo(1.5,-4.5,4.5,-1.5,11,0);ctx.bezierCurveTo(4.5,1.5,1.5,4.5,0,11);ctx.bezierCurveTo(-1.5,4.5,-4.5,1.5,-11,0);ctx.bezierCurveTo(-4.5,-1.5,-1.5,-4.5,0,-11);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function eoCubic(x){return 1-Math.pow(1-x,3);}
function eiCubic(x){return x*x*x;}
function eInOut(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function eoBack(x){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}

function drawLogoBox(ctx,tr,cx,cy,box,scale,alpha){
  if(!tr||alpha<=0.001)return;
  var fit=box/Math.max(tr.w,tr.h)*scale, w=tr.w*fit, h=tr.h*fit;
  ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(tr.canvas,cx-w/2,cy-h/2,w,h);ctx.restore();
}
// tarjeta blanca redondeada con logo + nombre
function drawChip(ctx,cx,cy,cardW,tr,label,alpha,scale){
  if(alpha<=0.002)return;
  cardW=cardW*scale; var cardH=cardW*1.0;               // cuadrada
  ctx.save();ctx.globalAlpha=alpha;
  ctx.shadowColor='rgba(18,16,24,0.28)';ctx.shadowBlur=cardW*0.06;ctx.shadowOffsetY=cardW*0.02;
  ctx.fillStyle='#FFFFFF';rr(ctx,cx-cardW/2,cy-cardH/2,cardW,cardH,cardW*0.15);ctx.fill();
  ctx.restore();
  drawLogoBox(ctx,tr,cx,cy,cardW*0.60,1,alpha);   // logo REAL centrado, sin etiqueta (como el hero de /vsl)
}
function starBadge(ctx,cx,cy,size,scale,opacity,fill,spark){
  if(opacity<=0.001)return;
  ctx.save();ctx.globalAlpha=opacity;ctx.translate(cx,cy);ctx.scale(scale,scale);
  if(fill==='#FFFFFF'){ctx.shadowColor='rgba(0,0,0,0.18)';ctx.shadowBlur=size*0.16;ctx.shadowOffsetY=size*0.05;}
  ctx.fillStyle=fill;rr(ctx,-size/2,-size/2,size,size,size*0.28);ctx.fill();ctx.shadowColor='transparent';
  sparkle(ctx,0,0,size*0.32,spark);ctx.restore();
}
function lockup(ctx,cx,cy,targetW){
  var refStar=118; ctx.font='700 '+Math.round(refStar*0.86)+"px 'Geist', system-ui, sans-serif";
  var refGroup=refStar+refStar*0.34+ctx.measureText('MaKo').width;
  var K=targetW/refGroup, starSize=118*K, wordSize=Math.round(starSize*0.86);
  ctx.font='700 '+wordSize+"px 'Geist', system-ui, sans-serif";
  var wordW=ctx.measureText('MaKo').width, gap=starSize*0.34;
  var groupW=starSize+gap+wordW, groupLeft=cx-groupW/2;
  return {starSize:starSize,wordSize:wordSize,wordW:wordW,gap:gap,groupW:groupW,groupLeft:groupLeft,starCenterFinal:groupLeft+starSize/2,wordLeft:groupLeft+starSize+gap};
}

// ===== timeline (ms) =====
var DURATION=8400;
var appearStart=150, appearStep=150, appearDur=520;
var convStart=3300, convEnd=4520;
var starStart=4380, starPop=4720, starSettle=5020;
var slideStart=5080, slideEnd=5780, wordStart=5180, wordEnd=5880, badgeStart=5080, badgeEnd=5600;
var holdEnd=7500, fadeEnd=8300;

function setSize(c){var W=window.innerWidth,H=window.innerHeight;if(c.width!==W)c.width=W;if(c.height!==H)c.height=H;c.style.width=W+'px';c.style.height=H+'px';return [W,H];}

window.renderFull=function(t){
  var c=document.getElementById('c');var s=setSize(c),W=s[0],H=s[1];
  var ctx=c.getContext('2d'); ctx.clearRect(0,0,W,H);
  var cx=W/2, cy=H/2, fcy=H*0.72;   // MaKo colisiona/aparece mas abajo (sobre la laptop)
  var cardW=W*0.11, box=Math.min(W,H)*0.14;
  var fade=(t>=holdEnd)?(1-clamp((t-holdEnd)/(fadeEnd-holdEnd),0,1)):1;

  for(var i=0;i<LOGOS.length;i++){
    var tr=TR[LOGOS[i].name]; if(!tr)continue;
    var px=POS[i][0]*W, py=POS[i][1]*H;
    var dph=i*1.7, dx=Math.sin(t/950+dph)*(W*0.006), dy=Math.cos(t/1150+dph*1.3)*(H*0.008);
    if(t<convStart){
      var ai=appearStart+i*appearStep, ap=clamp((t-ai)/appearDur,0,1); if(ap<=0)continue;
      var sc=0.6+0.4*eoBack(ap);
      if(window.LOGO_STYLE==='card') drawChip(ctx,px+dx,py+dy,cardW,tr,LOGOS[i].label,ap*fade,sc);
      else drawLogoBox(ctx,tr,px+dx,py+dy,box,sc,ap*fade);
    } else if(t<convEnd){
      var cp=clamp((t-convStart)/(convEnd-convStart),0,1), e=eiCubic(cp);
      var x=lerp(px+dx,cx,e), y=lerp(py+dy,fcy,e), op=(cp<0.8?1:clamp(1-(cp-0.8)/0.2,0,1))*fade;
      if(window.LOGO_STYLE==='card') drawChip(ctx,x,y,cardW,tr,LOGOS[i].label,op,lerp(1,0.12,e));
      else drawLogoBox(ctx,tr,x,y,box,lerp(1,0.1,e),op);
    }
  }

  // ===== lockup MaKo (estilo badge|white), mas abajo en fcy, SIN aureola =====
  var style=window.MAKO_STYLE;
  var L=lockup(ctx,cx,fcy,W*0.30);
  var fillC = style==='white' ? '#FFFFFF' : '#1A1712';
  var sparkC='#F2B01E';

  // insignia blanca (solo estilo badge): panel blanco detras del lockup
  if(style==='badge' && t>=badgeStart){
    var bp=clamp((t-badgeStart)/(badgeEnd-badgeStart),0,1)*fade;
    if(bp>0.002){
      var padX=L.starSize*0.62, padY=L.starSize*0.55;
      ctx.save();ctx.globalAlpha=bp;
      ctx.shadowColor='rgba(18,16,24,0.28)';ctx.shadowBlur=L.starSize*0.35;ctx.shadowOffsetY=L.starSize*0.08;
      ctx.fillStyle='#FFFFFF';
      rr(ctx,L.groupLeft-padX,fcy-L.starSize/2-padY,L.groupW+padX*2,L.starSize+padY*2,(L.starSize+padY*2)*0.3);ctx.fill();
      ctx.restore();
    }
  }

  var starOp=0,starScale=0,starX=cx;
  if(t>=starStart){
    starOp=1;
    if(t<starPop)starScale=1.14*eoBack(clamp((t-starStart)/(starPop-starStart),0,1));
    else if(t<starSettle)starScale=lerp(1.14,1,eoCubic(clamp((t-starPop)/(starSettle-starPop),0,1)));
    else starScale=1;
    if(t>=slideStart){var sp=clamp((t-slideStart)/(slideEnd-slideStart),0,1);starX=lerp(cx,L.starCenterFinal,eInOut(sp));}
  }
  var wOp=0,wShift=0;
  if(t>=wordStart){var wp=clamp((t-wordStart)/(wordEnd-wordStart),0,1);wOp=eoCubic(wp);wShift=lerp(-14,0,eoCubic(wp));}
  if(wOp>0.001){
    ctx.save();ctx.globalAlpha=wOp*fade;ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.font='700 '+L.wordSize+"px 'Geist', system-ui, sans-serif";
    var tx=L.wordLeft+wShift;
    if(style==='white'){ ctx.fillStyle='#FFFFFF'; }
    else { var ph=(t%2600)/2600, gxc=tx-L.wordW*0.4+ph*(L.wordW*1.8);
      var lg=ctx.createLinearGradient(gxc-L.wordW*0.5,0,gxc+L.wordW*0.5,0);
      lg.addColorStop(0,'#171A21');lg.addColorStop(0.42,'#171A21');lg.addColorStop(0.5,'#F2A516');lg.addColorStop(0.58,'#171A21');lg.addColorStop(1,'#171A21');
      ctx.fillStyle=lg; }
    ctx.fillText('MaKo',tx,fcy);ctx.restore();
  }
  starBadge(ctx,starX,fcy,L.starSize,starScale,starOp*fade,fillC,sparkC);
  return true;
};

// ===== chip individual (para el set con nombre sobre tarjeta) =====
window.renderChip=function(t){
  var idx=Math.round(t);
  var c=document.getElementById('c');var s=setSize(c),W=s[0],H=s[1];
  var ctx=c.getContext('2d'); ctx.clearRect(0,0,W,H);
  var L=LOGOS[idx]; var tr=L&&TR[L.name]; if(!tr)return true;
  drawChip(ctx,W/2,H/2,W*0.84,tr,L.label,1,1);
  return true;
};
// ===== MaKo standalone (grande) segun estilo =====
window.renderMako=function(t){
  var c=document.getElementById('c');var s=setSize(c),W=s[0],H=s[1];
  var ctx=c.getContext('2d'); ctx.clearRect(0,0,W,H);
  var cx=W/2, cy=H/2, style=window.MAKO_STYLE;
  var L=lockup(ctx,cx,cy,W*0.62);
  var fillC = style==='white' ? '#FFFFFF' : '#1A1712';
  if(style==='badge'){
    var padX=L.starSize*0.62, padY=L.starSize*0.55;
    ctx.save();ctx.shadowColor='rgba(18,16,24,0.28)';ctx.shadowBlur=L.starSize*0.35;ctx.shadowOffsetY=L.starSize*0.08;
    ctx.fillStyle='#FFFFFF';rr(ctx,L.groupLeft-padX,cy-L.starSize/2-padY,L.groupW+padX*2,L.starSize+padY*2,(L.starSize+padY*2)*0.3);ctx.fill();ctx.restore();
  }
  // wordmark
  ctx.save();ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='700 '+L.wordSize+"px 'Geist', system-ui, sans-serif";
  if(style==='white'){ctx.fillStyle='#FFFFFF';}
  else{var ph=(t%2600)/2600,gxc=L.wordLeft-L.wordW*0.4+ph*(L.wordW*1.8);var lg=ctx.createLinearGradient(gxc-L.wordW*0.5,0,gxc+L.wordW*0.5,0);
    lg.addColorStop(0,'#171A21');lg.addColorStop(0.42,'#171A21');lg.addColorStop(0.5,'#F2A516');lg.addColorStop(0.58,'#171A21');lg.addColorStop(1,'#171A21');ctx.fillStyle=lg;}
  ctx.fillText('MaKo',L.wordLeft,cy);ctx.restore();
  starBadge(ctx,L.starCenterFinal,cy,L.starSize,1,1,fillC,'#F2B01E');
  return true;
};
window.LOGO_ORDER=LOGOS.map(function(L){return L.name;});
</script></body></html>
