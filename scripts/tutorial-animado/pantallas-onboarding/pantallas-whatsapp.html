<!doctype html>
<!-- LAS PANTALLAS DEL WHATSAPP DEL VIDEO DE BIENVENIDA (onboarding V2, 19/11/2026). El Cerebro: «lo que dice la voz se tiene que VER»:
     en cada frase de WhatsApp, lo que nombra, de cerca. Se dibuja una por vez (?s=1…5) a 1920×1080 y se monta sobre el video con
     ffmpeg en el segundo de su frase (montar.mjs, al lado). Los colores y las piezas, los del onboarding de la app
     (app/onboarding/ChatArranqueV2.tsx) y los de WhatsApp. -->
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --azul: #2F6FED; --oro: #F2B01E; --ink: #12151B; --dim: #5D6470; --wa: #25D366; --wa-osc: #00A884; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; color: var(--ink); }
body { background: radial-gradient(120% 90% at 50% 20%, #FCFCFB 0%, #F1F1EF 70%, #E9E9E6 100%); }
/* El título, en una franja arriba (lo acercado pasa por debajo). */
.cap { position: absolute; z-index: 2; left: 0; right: 0; top: 0; margin: 0; padding: 46px 0 34px; text-align: center; font-weight: 800; font-size: 72px; letter-spacing: -0.02em; line-height: 1.1;
  background: linear-gradient(#FBFBFA 78%, rgba(251, 251, 250, 0)); }
.marca { z-index: 2; }
/* DE CERCA (el Cerebro, 19/11: en el reproductor de ~470 px de la app, el teléfono y el panel no se leían): la escena se agranda y
   se centra en lo que nombra la frase (`foco`), que queda grande en el medio del cuadro, debajo del título. */
.escena { transform-origin: 0 0; }
.cap b { color: var(--azul); font-weight: 800; } .cap i { color: var(--oro); font-style: normal; }
.marca { position: absolute; left: 34px; bottom: 30px; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 24px; }
.marca img { width: 34px; height: 34px; }
.escena { position: absolute; left: 0; right: 0; top: 270px; bottom: 50px; display: grid; place-items: center; }
.anillo { box-shadow: 0 0 0 8px rgba(47, 111, 237, .95), 0 0 0 22px rgba(47, 111, 237, .18) !important; }
/* — el onboarding (la tarjeta del código) — */
.onb { width: 1120px; display: flex; gap: 26px; align-items: flex-start; }
.onb__foto { width: 70px; height: 70px; flex: none; margin-top: 6px; }
.onb__globo { flex: 1; background: #FCFCFB; border-radius: 0 28px 28px 28px; padding: 30px 34px 26px; box-shadow: 0 2px 2px rgba(11, 20, 26, .1), 0 24px 60px rgba(18, 21, 27, .1); font-size: 34px; line-height: 1.45; }
.onb__tarjeta { margin-top: 22px; background: #EFEFED; border: 2px solid #E2E2DF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 20px; }
.wa-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 16px; height: 92px; padding: 0 40px; border-radius: 999px; background: var(--wa); color: #fff; font-weight: 700; font-size: 38px; box-shadow: 0 4px 18px rgba(37, 211, 102, .35); }
.wa-btn svg { width: 40px; height: 40px; }
.rot { font-size: 28px; color: var(--dim); }
.fila { display: flex; gap: 18px; }
.campo { flex: 1; height: 96px; border-radius: 20px; border: 2px solid #C9C9C4; background: #fff; display: grid; place-items: center; font-weight: 600; font-size: 48px; letter-spacing: .3em; color: #B7B7B2; font-variant-numeric: tabular-nums; }
.campo--lleno { color: var(--ink); }
.btn-negro { height: 96px; padding: 0 40px; border-radius: 20px; background: var(--ink); color: #fff; font-weight: 700; font-size: 34px; display: grid; place-items: center; }
.btn-gris { background: #8E8E8A; }
.pie { display: flex; gap: 34px; font-size: 26px; color: var(--dim); } .pie u { text-underline-offset: 6px; } .pie b { margin-left: auto; color: var(--ink); }
/* — WhatsApp (el teléfono) — */
.tel { width: 720px; height: 730px; border-radius: 48px; background: #EFEAE2; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 14px #121212, 0 30px 80px rgba(0, 0, 0, .28); }
.tel__cab { height: 112px; flex: none; background: #F0F2F5; display: flex; align-items: center; gap: 20px; padding: 0 30px; border-bottom: 1px solid #DADDE1; }
.tel__cab img { width: 70px; height: 70px; border-radius: 50%; background: #fff; }
.tel__cab b { font-size: 34px; display: block; } .tel__cab small { font-size: 24px; color: #667781; }
.tel__hilo { flex: 1; padding: 30px 28px; display: flex; flex-direction: column; justify-content: flex-end; gap: 18px; }
.msg { max-width: 82%; padding: 16px 22px 12px; border-radius: 18px; font-size: 30px; line-height: 1.4; background: #fff; box-shadow: 0 1px 1px rgba(11, 20, 26, .13); }
.msg--yo { align-self: flex-end; background: #D9FDD3; }
.msg p { margin: 0; } .msg .hora { display: block; text-align: right; font-size: 20px; color: #667781; margin-top: 4px; }
.cod { font-weight: 800; background: #FFF3C4; padding: 0 6px; border-radius: 6px; }
.tel__compone { flex: none; display: flex; align-items: center; gap: 16px; padding: 18px 22px; background: #F0F2F5; }
.tel__campo { flex: 1; min-height: 76px; border-radius: 38px; background: #fff; display: flex; align-items: center; padding: 0 28px; font-size: 30px; }
.tel__enviar { width: 76px; height: 76px; border-radius: 50%; background: var(--wa-osc); display: grid; place-items: center; }
.tel__enviar svg { width: 34px; height: 34px; }
.vcard { background: #fff; width: 76%; border-radius: 18px; box-shadow: 0 1px 1px rgba(11, 20, 26, .13); overflow: hidden; }
.vcard__arriba { display: flex; align-items: center; gap: 20px; padding: 22px 24px; }
.vcard__arriba img { width: 84px; height: 84px; border-radius: 50%; background: #FCFCFB; border: 1px solid #eee; }
.vcard__arriba b { font-size: 34px; }
.vcard__btn { border-top: 1px solid #E9EDEF; text-align: center; padding: 20px; font-size: 30px; font-weight: 600; color: var(--wa-osc); }
.oculto { display: none !important; }
</style></head>
<body>
<p class="cap" id="cap"></p>
<div class="escena">
  <!-- el onboarding: la tarjeta del código (pantallas 1 y 4) -->
  <div class="onb" id="onb">
    <img class="onb__foto" data-estrella alt="">
    <div class="onb__globo">
      Para confirmar tu WhatsApp, toca «Abrir WhatsApp» y envía el mensaje de confirmación. Te contesto con un código y lo pegas aquí abajo.
      <div class="onb__tarjeta">
        <span class="wa-btn" id="wa-btn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M3.5 20.5l1.3-4A8.5 8.5 0 1 1 8 19.6z"/></svg>Abrir WhatsApp</span>
        <span class="rot">Pega aquí el código</span>
        <div class="fila"><span class="campo" id="campo">000000</span><span class="btn-negro btn-gris" id="confirmar">Confirmar</span></div>
        <div class="pie"><u>Cambiar número</u><u>Reenviar el código</u><b>Pegar</b></div>
      </div>
    </div>
  </div>
  <!-- WhatsApp (pantallas 2, 3 y 5) -->
  <div class="tel oculto" id="tel">
    <div class="tel__cab"><img data-estrella alt=""><span><b>MaKo</b><small>en línea</small></span></div>
    <div class="tel__hilo" id="hilo"></div>
    <div class="tel__compone"><span class="tel__campo" id="compone">Mensaje</span><span class="tel__enviar" id="enviar"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></span></div>
  </div>
</div>
<div class="marca"><img data-estrella alt="">MaKo</div>
