<title>Landings de MaKo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- La publicación del artifact pone el doctype, el head y el body: aquí va sólo el contenido.
     El visor de las landings de hola-mako.com/vsl. Lo arma scripts/visor-landings/armar.mjs (docs/relevo/landings-vsl.md): cada
     página es una FOTO del DOM (paginas/<slug>.html a 1440 px y paginas/<slug>-tel.html a 390 px).
     Martín (12/11/2026): «elimina también la sidebar de landings de MaKo porque yo debería poder navegar por todo con lo que ya
     tenemos, de la navegación de la top bar» y «haz que todo sea navegable tal cual como quedaría». Por eso no hay lista: la
     página ocupa todo, sus links la llevan a la página que corresponde, y el modo claro / oscuro es el botón de la propia página. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Una mesa de revisión mínima: la página entera y, abajo, una barra flotante con lo que la página no tiene. */
:root{
  --bg:#E7EBF2;--panel:rgba(255,255,255,.94);--fg:#12151B;--muted:#5C6676;--line:#DCE2EC;--soft:#EEF2F8;--accent:#2F6FED;
  --f-ui:"Urbanist",ui-sans-serif,system-ui,sans-serif;--f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090C12;--panel:rgba(21,26,36,.94);--fg:#E9EDF4;--muted:#98A2B3;--line:#2A3342;--soft:#1C2330;--accent:#6E9CFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#090C12;--panel:rgba(21,26,36,.94);--fg:#E9EDF4;--muted:#98A2B3;--line:#2A3342;--soft:#1C2330;--accent:#6E9CFF;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;overflow:hidden}
.escenario{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.marco{position:absolute;top:0;left:50%;transform-origin:top center;background:#fff}
.marco.tel{top:16px;border-radius:26px;overflow:hidden;box-shadow:0 0 0 10px #12151B,0 18px 50px rgba(0,0,0,.35)}
.marco iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.mando{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);padding:6px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(10,14,22,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mando button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 13px/1 var(--f-ui);padding:8px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.mando button:hover{color:var(--fg);background:var(--soft)}
.mando button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.mando button:disabled{opacity:.4;cursor:default;background:transparent}
.mando button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:11px;background:var(--soft)}
.sep{width:1px;align-self:stretch;margin:4px 2px;background:var(--line)}
.donde{min-width:0;max-width:220px;padding:0 6px;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aviso{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;max-width:min(520px,calc(100% - 24px));margin:0;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:13px;box-shadow:0 8px 24px rgba(10,14,22,.18)}
@media (max-width:640px){
  .donde,.sep-donde{display:none}
  .mando{gap:4px;padding:5px}
  .mando button{padding:8px 8px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="escenario" id="escenario">
  <div class="marco" id="marco"><iframe id="pagina" title="La página"></iframe></div>
</div>
<p class="aviso" id="aviso" hidden></p>
<div class="mando" role="toolbar" aria-label="Controles del visor">
  <button type="button" id="atras" title="Volver a la página anterior">← Atrás</button>
  <span class="donde" id="donde"></span>
  <span class="sep sep-donde" aria-hidden="true"></span>
  <span class="seg" id="ctl-pantalla"><button type="button" data-v="pc">Computadora</button><button type="button" data-v="tel">Teléfono</button></span>
  <span class="seg" id="ctl-diseno"><button type="button" data-v="copiado">Copiado</button><button type="button" data-v="mako">Diseño MaKo</button></span>
</div>

<script>
const PAGINAS = /*PAGINAS*/[];
const DE_LA_APP = /*DE_LA_APP*/[];
const ALIAS = /*ALIAS*/{};
// Las páginas cuya foto a 390 es idéntica a la de 1440 no se publican dos veces (el artefacto tiene un tope de 512 archivos).
const TEL_IGUAL = new Set(/*TEL_IGUAL*/[]);
const TODAS = PAGINAS.concat(DE_LA_APP);
const PORTADA = 'sitio';
// Las letras de MaKo para «Diseño MaKo», publicadas junto al visor (relativas a paginas/<slug>.html).
const FUENTE_SANS = '../assets/fuentes-mako/urbanist.woff2';
const FUENTE_MONO = '../assets/fuentes-mako/geist-mono.woff2';

const estado = { slug: null, diseno: 'copiado', pantalla: 'pc' };
const pila = [];
const $ = (id) => document.getElementById(id);
const iframe = $('pagina');

/** La página del visor para un link de la página: su ruta, un alias (el logo) o un aviso. */
function destino(href) {
  let u;
  try { u = new URL(href, 'https://hola-mako.com/'); } catch (e) { return null; }
  if (u.protocol !== 'https:' && u.protocol !== 'http:') return { aviso: u.protocol === 'mailto:' ? `Ese link escribe a ${u.pathname}: en el visor no se abre el correo.` : 'Ese link no se abre en el visor.' };
  if (u.hostname !== 'hola-mako.com' && u.hostname !== 'www.hola-mako.com') return { aviso: `Ese link lleva afuera (${u.hostname}): en el visor no se abre.` };
  const ruta = u.pathname.replace(/\/+$/, '') || '/';
  const slug = ALIAS[ruta] || (TODAS.find((p) => p.ruta === ruta) || {}).slug;
  if (slug) return { slug, ancla: u.hash.slice(1) };
  if (/^\/planes\/[a-z-]+/.test(ruta)) return { aviso: 'Aquí se abre el pago de ese plan: el visor no lo muestra.' };
  return { aviso: `${ruta} no está en el visor.` };
}

function encuadrar() {
  const e = $('escenario'), m = $('marco');
  const W = e.clientWidth, H = e.clientHeight;
  if (estado.pantalla === 'pc') {
    const k = Math.min(1, W / 1440);
    m.className = 'marco'; m.style.width = '1440px'; m.style.height = (H / k) + 'px';
    m.style.transform = `translateX(-50%) scale(${k})`;
  } else {
    const libre = H - 32 - 70;
    const k = Math.min(1, libre / 844, (W - 28) / 390);
    m.className = 'marco tel'; m.style.width = '390px'; m.style.height = Math.min(844, libre / k) + 'px';
    m.style.transform = `translateX(-50%) scale(${k})`;
  }
}
addEventListener('resize', encuadrar);

function marcar() {
  for (const [id, k] of [['ctl-diseno', 'diseno'], ['ctl-pantalla', 'pantalla']]) {
    $(id).querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === estado[k])));
  }
  const p = TODAS.find((x) => x.slug === estado.slug);
  $('donde').textContent = p ? 'hola-mako.com' + (p.slug === PORTADA ? '' : p.ruta) : '';
  $('atras').disabled = pila.length === 0;
}

function abrir(slug, { ancla = '', guardar = true, conservarScroll = false } = {}) {
  const p = TODAS.find((x) => x.slug === slug) || TODAS.find((x) => x.slug === PORTADA) || TODAS[0];
  if (guardar && estado.slug && estado.slug !== p.slug) pila.push(estado.slug);
  let y = 0;
  try { if (conservarScroll && estado.slug === p.slug) { const w = iframe.contentWindow; y = w.scrollY / Math.max(1, w.document.documentElement.scrollHeight); } } catch (e) {}
  estado.slug = p.slug;
  if (location.hash.slice(1) !== p.slug) { try { history.replaceState(null, '', '#' + p.slug); } catch (e) {} }
  iframe.onload = () => prepararPagina(y, ancla);
  iframe.src = `paginas/${p.slug}${estado.pantalla === 'tel' && !TEL_IGUAL.has(p.slug) ? '-tel' : ''}.html`;
  encuadrar(); marcar();
}

// ── Diseño MaKo: la letra de MaKo y el tono propio de la referencia pasado al azul (220°) o al dorado (42°) de MaKo ──────
const RGB = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/g;
function aHsl(r, g, b) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; } return [h, s, l]; }
function aRgb(h, s, l) { const k = (n) => (n + h / 30) % 12; const a = s * Math.min(l, 1 - l); const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return [f(0), f(8), f(4)].map((v) => Math.round(v * 255)); }
const cadena = (rgb, a) => a !== undefined ? `rgba(${rgb.join(', ')}, ${a})` : `rgb(${rgb.join(', ')})`;
function mapear(txt, fn) { return txt.replace(RGB, (m0, r, g, b, a) => fn(+r, +g, +b, a) || m0); }
function haciaMaKo(r, g, b, a) {
  const [h, s, l] = aHsl(r, g, b);
  if (s < .25 || l < .08 || l > .97) return null;
  if ((h >= 200 && h <= 235) || (h >= 35 && h <= 52) || h < 15 || h >= 345 || (h >= 90 && h <= 165)) return null;
  return cadena(aRgb(h >= 15 && h < 35 ? 42 : 220, s, l), a);
}
function disenoMaKo(d, w) {
  if (!d.getElementById('visor-letras-mako')) {
    const st = d.createElement('style'); st.id = 'visor-letras-mako';
    st.textContent = `@font-face{font-family:'MaKo Sans';font-weight:100 900;src:url(${FUENTE_SANS}) format('woff2')}@font-face{font-family:'MaKo Mono';font-weight:100 900;src:url(${FUENTE_MONO}) format('woff2')}`;
    d.head.appendChild(st);
  }
  const mono = /mono|courier|consol|menlo|code/i;
  for (const n of d.querySelectorAll('body, body *')) {
    if (n.closest('script, style')) continue;
    const cs = w.getComputedStyle(n);
    n.style.setProperty('font-family', mono.test(cs.fontFamily) ? "'MaKo Mono', ui-monospace, monospace" : "'MaKo Sans', system-ui, sans-serif", 'important');
    for (const prop of ['color', 'background-color', 'border-top-color', 'border-bottom-color', 'border-left-color', 'border-right-color', 'fill', 'stroke', 'background-image', 'box-shadow', 'outline-color', 'text-decoration-color']) {
      const v = cs.getPropertyValue(prop); if (!v || v === 'none') continue;
      const nv = mapear(v, haciaMaKo); if (nv !== v) n.style.setProperty(prop, nv, 'important');
    }
  }
}

function prepararPagina(y, ancla) {
  const d = iframe.contentDocument, w = iframe.contentWindow;
  if (!d) return;
  d.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a'); if (!a) return;
    const href = a.getAttribute('href') || '';
    if (!href || href.startsWith('#')) return;
    e.preventDefault();
    const x = destino(href);
    if (!x) return;
    if (x.aviso) { mostrarAviso(x.aviso); return; }
    if (x.slug === estado.slug) { if (x.ancla) { const el = d.getElementById(x.ancla); if (el) el.scrollIntoView({ behavior: 'smooth' }); } return; }
    abrir(x.slug, { ancla: x.ancla });
  }, true);
  if (estado.diseno === 'mako') {
    disenoMaKo(d, w);
    // Al pasar de claro a oscuro con el botón de la página, la página reescribe sus colores: se vuelven a pasar a MaKo.
    w.addEventListener('mako-sitio-modo', () => disenoMaKo(d, w));
  }
  const el = ancla ? d.getElementById(ancla) : null;
  if (el) el.scrollIntoView();
  else if (y) w.scrollTo(0, y * d.documentElement.scrollHeight);
}

let avisoTimer = 0;
function mostrarAviso(t) {
  const a = $('aviso'); a.textContent = t; a.hidden = false; clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => { a.hidden = true; }, 3200);
}

$('atras').addEventListener('click', () => { const s = pila.pop(); if (s) abrir(s, { guardar: false }); });
for (const [id, k] of [['ctl-diseno', 'diseno'], ['ctl-pantalla', 'pantalla']]) {
  $(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b || estado[k] === b.dataset.v) return;
    estado[k] = b.dataset.v;
    try { localStorage.setItem('visor-' + k, b.dataset.v); } catch (err) {}
    abrir(estado.slug, { guardar: false, conservarScroll: true });
  });
}
try {
  estado.diseno = localStorage.getItem('visor-diseno') || 'copiado';
  estado.pantalla = localStorage.getItem('visor-pantalla') || (innerWidth < 860 ? 'tel' : 'pc');
} catch (e) { estado.pantalla = innerWidth < 860 ? 'tel' : 'pc'; }
addEventListener('hashchange', () => { const s = location.hash.slice(1); if (s && s !== estado.slug) abrir(s); });
abrir(location.hash.slice(1) || PORTADA, { guardar: false });
</script>
