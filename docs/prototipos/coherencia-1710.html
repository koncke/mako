<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coherencia (prototipo)</title>
<style>
/* Prototipo clickeable «coherencia»: Dashboard unido, perfil/More, y las tarjetas de CRM, Clients y Plan con UNA sola estética.
   Parte de sidebar-nueva-1710.html. Un solo archivo, sin dependencias, datos inventados.
   Colores de MaKo: Nord + azul Meta, CLARO por defecto. Azul = vos actuás · naranja = MaKo · un significado por color.
   Color por SECCIÓN (verde Sales, violeta Marketing, turquesa Create, azul lo de todos los días, gris los ajustes). */
:root {
  --bg: #E5E9F0; --canvas: #E9EDF4; --surface: #F1F4F9; --surface-2: #D8DEE9;
  --border: #D8DEE9; --border-strong: #BEC8DA;
  --ink: #2E3440; --dim: #4C566A; --faint: #6B7893; --sub: #5A6680;
  --sidebar: #E5E9F0; --sidebar-line: #CBD3E1;
  --primary: #0B5EE5; --primary-strong: #0A53C9; --primary-bg: #DDE8FB; --on-primary: #FFFFFF;
  --mako: #D08770; --mako-ink: #964831; --mako-bg: #F5E9E5;
  --good: #50683B; --good-bg: #E1EBD8; --warn: #835F16; --warn-bg: #F4EAD0; --bad: #9B313B; --bad-bg: #F3DDE0;
  --card: #FFFFFF; --card-line: rgba(46, 52, 64, .06); --col: rgba(216, 222, 233, .55);
  --velo: rgba(46, 52, 64, .07);
  --shadow-card: 0 1px 2px rgba(46, 52, 64, .06), 0 6px 20px rgba(46, 52, 64, .07);
  --shadow-float: 0 10px 30px rgba(46, 52, 64, .2);
  --sombra: 0 18px 44px rgba(46, 52, 64, .22);
  --c-blue: #0B5EE5; --c-blue-bg: #DDE8FB; --c-green: #50683B; --c-green-bg: #E1EBD8;
  --c-purple: #7A4C73; --c-purple-bg: #EBDFE9; --c-teal: #2F6F73; --c-teal-bg: #D6EAEB; --c-grey: #4C566A; --c-grey-bg: #DCE2EC;
  --p1: #BF616A; --p2: #C79226; --p3: #0B5EE5; --p4: #8E9BB4;
  --feat-bg: linear-gradient(135deg, #0B5EE5 0%, #2F7BF2 100%); --feat-ink: #FFFFFF; --feat-track: rgba(255, 255, 255, .3); --feat-fill: #FFFFFF; --feat-pill: #FFFFFF; --feat-pill-ink: #0A3F9E;
  --bezel: #1B1F27;
  --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #2E3440; --canvas: #2A2F3A; --surface: #343B49; --surface-2: #434C5E;
  --border: #434C5E; --border-strong: #4C566A;
  --ink: #ECEFF4; --dim: #ABB9CF; --faint: #8E9BB4; --sub: #AAB6CC;
  --sidebar: #2E3440; --sidebar-line: #434C5E;
  --primary: #8AB4FA; --primary-strong: #A3C5FB; --primary-bg: #33405A; --on-primary: #2E3440;
  --mako: #D08770; --mako-ink: #E0A18A; --mako-bg: #503730;
  --good: #A3BE8C; --good-bg: #3E4A36; --warn: #EBCB8B; --warn-bg: #4D4430; --bad: #E699A6; --bad-bg: #523038;
  --card: #3B4252; --card-line: rgba(255, 255, 255, .05); --col: rgba(0, 0, 0, .16);
  --velo: rgba(255, 255, 255, .07);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 22px rgba(0, 0, 0, .25);
  --shadow-float: 0 10px 30px rgba(0, 0, 0, .5);
  --sombra: 0 18px 44px rgba(0, 0, 0, .5);
  --c-blue: #8AB4FA; --c-blue-bg: #33405A; --c-green: #A3BE8C; --c-green-bg: #3E4A36;
  --c-purple: #D7A9CF; --c-purple-bg: #4A3E4A; --c-teal: #8FBCBB; --c-teal-bg: #34494C; --c-grey: #ABB9CF; --c-grey-bg: #434C5E;
  --p1: #E699A6; --p2: #EBCB8B; --p3: #8AB4FA; --p4: #8E9BB4;
  --feat-bg: linear-gradient(135deg, #2D4F8F 0%, #3A63AE 100%); --feat-ink: #FFFFFF; --feat-track: rgba(255, 255, 255, .25); --feat-fill: #FFFFFF; --feat-pill: #FFFFFF; --feat-pill-ink: #1D3F7D;
  --bezel: #12151B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
/* El cambio de tema es gradual, no de golpe (nordtheme.com): la clase .tt vive 450 ms sólo mientras se cambia. */
html.tt *, html.tt *::before, html.tt *::after { transition: background-color .4s ease-in-out, color .4s ease-in-out, border-color .4s ease-in-out, box-shadow .4s ease-in-out, fill .4s, stroke .4s !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
svg { display: block; flex: none; }
b { font-weight: 700; }

/* ── Barra del prototipo (no es parte de la app) ── */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-strong); background: var(--surface); position: sticky; top: 0; z-index: 80; }
.bar h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 650; letter-spacing: -.01em; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 99px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 5px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: var(--dim); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--border-strong); border-radius: 99px; font-size: 12.5px; font-weight: 600; color: var(--dim); background: var(--bg); }
.chip[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
.sp { flex: 1; }
.note { margin: 0; padding: 10px 16px; font-size: 12.5px; color: var(--dim); border-bottom: 1px solid var(--border); background: var(--bg); }
.note b { color: var(--ink); font-weight: 650; }
.themebtn { width: 34px; height: 30px; display: grid; place-items: center; border: 1px solid var(--border-strong); border-radius: 99px; background: var(--bg); color: var(--dim); }
.themebtn .sun { display: none; } :root[data-theme="dark"] .themebtn .sun { display: block; } :root[data-theme="dark"] .themebtn .moon { display: none; }
kbd { font-family: var(--mono); font-size: 10.5px; padding: 1px 5px; border: 1px solid var(--border-strong); border-radius: 5px; color: var(--faint); background: var(--bg); }

/* ── Piezas del kit (se usan en TODAS las pantallas) ── */
.kpill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 99px; font-size: 13px; font-weight: 650; white-space: nowrap; flex: none; }
.kpill.sm { height: 30px; padding: 0 12px; font-size: 12.5px; }
.kpill.fill { background: var(--primary); color: var(--on-primary); }
.kpill.soft { background: var(--primary-bg); color: var(--primary-strong); }
.kpill.line { border: 1.5px solid var(--border-strong); color: var(--ink); }
.kpill.fw { background: var(--feat-pill); color: var(--feat-pill-ink); }
.kpill.fo { border: 1.5px solid rgba(255, 255, 255, .6); color: var(--feat-ink); }
.kpill:hover { filter: brightness(.96); }
.rbtn { width: 40px; height: 40px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow-card); display: grid; place-items: center; color: var(--ink); flex: none; }
.ptabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 3px 2px 5px; }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 15px; border-radius: 99px; background: var(--card); box-shadow: var(--shadow-card); font-size: 13.5px; font-weight: 650; color: var(--dim); white-space: nowrap; flex: none; }
.ptab i { font-style: normal; font-size: 11.5px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; background: var(--velo); }
.ptab[aria-selected="true"] { background: var(--primary); color: var(--on-primary); }
.ptab[aria-selected="true"] i { background: rgba(255, 255, 255, .25); }
.ptab:not([aria-selected="true"]):hover { color: var(--ink); }
.c-blue { background: var(--c-blue-bg); color: var(--c-blue); } .c-green { background: var(--c-green-bg); color: var(--c-green); }
.c-purple { background: var(--c-purple-bg); color: var(--c-purple); } .c-teal { background: var(--c-teal-bg); color: var(--c-teal); }
.c-grey { background: var(--c-grey-bg); color: var(--c-grey); } .c-mako { background: var(--mako-bg); color: var(--mako-ink); }
.kchip { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.klist { background: var(--card); border-radius: 22px; box-shadow: var(--shadow-card); border: 1px solid var(--card-line); overflow: hidden; }
.krow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; font-size: 15px; font-weight: 560; }
.krow + .krow { border-top: 1px solid var(--border); }
.krow:hover { background: var(--velo); }
.kl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kch { color: var(--faint); margin-left: 2px; }
.kcount { font-size: 13px; font-weight: 650; color: var(--sub); }
.ktag { font-size: 10.5px; color: var(--faint); }
.krow.danger { color: var(--bad); }
.glabel { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 18px 6px 7px; }
.ph { display: grid; place-items: center; width: var(--s); height: var(--s); border-radius: 50%; overflow: hidden; font-weight: 700; font-size: calc(var(--s) * .36); letter-spacing: -.01em; }
.ph svg { width: 100%; height: 100%; }
.avw { position: relative; display: inline-block; width: var(--s); height: var(--s); flex: none; }
.chb { position: absolute; right: -3px; bottom: -3px; width: max(17px, calc(var(--s) * .38)); height: max(17px, calc(var(--s) * .38)); border-radius: 50%; border: 2px solid var(--card); display: grid; place-items: center; }
.edit { position: absolute; right: -2px; bottom: -2px; width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; border: 3px solid var(--card); }
.edit.sm { width: 26px; height: 26px; border-width: 2px; }
.pbar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.pbar > i { display: block; height: 100%; border-radius: 99px; background: var(--primary); }
.feat { background: var(--feat-bg); color: var(--feat-ink); border-radius: 26px; padding: 18px; box-shadow: var(--shadow-card); position: relative; overflow: hidden; }
.feat .over { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.feat h3 { margin: 4px 0 2px; font-size: 19px; letter-spacing: -.015em; font-weight: 700; }
.feat .fs { font-size: 13px; opacity: .9; }
.feat .prog { height: 8px; border-radius: 99px; background: var(--feat-track); overflow: hidden; margin: 14px 0 6px; }
.feat .prog > i { display: block; height: 100%; background: var(--feat-fill); border-radius: 99px; }
.feat .pl { font-size: 12px; opacity: .9; display: flex; justify-content: space-between; }
.feat .fpills { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.feat .fpills .kpill { flex: 1; }
.feat.wide { display: flex; align-items: center; gap: 22px; padding: 16px 20px; }
.feat.wide .f1 { flex: 1.2; min-width: 0; } .feat.wide .f2 { flex: 1; min-width: 0; } .feat.wide .fpills { margin: 0; flex: none; }
.feat.wide .prog { margin: 8px 0 4px; }
.feat .who { display: flex; align-items: center; gap: 12px; }
.chipst { white-space: nowrap; display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; }
.st-ok { background: var(--good-bg); color: var(--good); } .st-risk { background: var(--warn-bg); color: var(--warn); } .st-bad { background: var(--bad-bg); color: var(--bad); }
.st-blue { background: var(--primary-bg); color: var(--primary-strong); } .st-mako { background: var(--mako-bg); color: var(--mako-ink); }

/* Tarjeta de lead / cliente */
.lc { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 22px; padding: 12px; box-shadow: var(--shadow-card); border: 1px solid var(--card-line); }
.lc[draggable="true"] { cursor: grab; }
.lc-tx { flex: 1; min-width: 0; }
.lc-tx b { display: flex; align-items: center; gap: 6px; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lc-tx .sub { display: block; font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.udot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; }
.cc { background: var(--card); border-radius: 22px; padding: 12px; box-shadow: var(--shadow-card); border: 1px solid var(--card-line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.cc .lc { box-shadow: none; border: 0; padding: 0; background: none; }
.cc .meter { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--sub); }
.cc .meter .pbar { flex: 1; min-width: 40px; } .cc .meter span { white-space: nowrap; }
.cc .meter .chipst { min-width: 0; }
/* tarjeta de HOY, sólo para comparar */
.old { background: var(--card); border: 1px solid var(--border-strong); border-radius: 10px; padding: 11px 12px; display: grid; gap: 6px; box-shadow: none; }
.old b { font-size: 14px; font-weight: 700; display: block; } .old .o2 { font-size: 12.5px; color: var(--faint); }
.old .o3 { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); }
.old .o3 b { font-size: 12.5px; color: var(--ink); }
/* tarjeta de tarea */
.tc { display: flex; align-items: flex-start; gap: 11px; background: var(--card); border-radius: 22px; padding: 13px 13px 12px; box-shadow: var(--shadow-card); border: 1px solid var(--card-line); }
.tc[draggable="true"] { cursor: grab; }
.tc-tx { flex: 1; min-width: 0; }
.tc-tx b { display: block; font-size: 14.5px; line-height: 1.3; letter-spacing: -.005em; font-weight: 650; }
.tc.done .tc-tx b { text-decoration: line-through; color: var(--faint); font-weight: 560; }
.tc-meta { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; margin-top: 7px; }
.projc { font-size: 11.5px; font-weight: 650; padding: 2px 9px; border-radius: 99px; background: var(--c-grey-bg); color: var(--c-grey); }
.due { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--sub); font-weight: 560; }
.due.today { color: var(--primary-strong); font-weight: 700; } .due.over { color: var(--bad); font-weight: 700; }
.mk { font-size: 10.5px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--mako-bg); color: var(--mako-ink); }
.why { font-size: 11.5px; color: var(--sub); font-style: italic; }
.pr { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid var(--pc); background: color-mix(in srgb, var(--pc) 14%, transparent); flex: none; display: grid; place-items: center; margin-top: 1px; color: #fff; }
.pr:hover { background: color-mix(in srgb, var(--pc) 34%, transparent); }
.pr.p1 { --pc: var(--p1); } .pr.p2 { --pc: var(--p2); } .pr.p3 { --pc: var(--p3); } .pr.p4 { --pc: var(--p4); } .pr.p0 { --pc: var(--p4); border-style: dashed; }
.tc.done .pr { background: var(--good); border-color: var(--good); }
.tc.done .pr svg { color: var(--card); }

/* Tableros */
.board { flex: 1; min-height: 0; display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; }
.kcol { width: 304px; flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--col); border-radius: 26px; padding: 12px 10px 10px; }
.kcol.over { outline: 2px dashed var(--primary); outline-offset: -3px; }
.kh { display: flex; align-items: center; gap: 8px; padding: 2px 6px 10px; }
.kn { font-weight: 700; font-size: 14.5px; letter-spacing: -.01em; }
.kc { font-size: 11.5px; font-weight: 700; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow-card); }
.kt { margin-left: auto; font-size: 12px; color: var(--sub); font-weight: 600; }
.cards { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-content: start; overflow-y: auto; padding: 2px 2px 8px; flex: 1; min-height: 0; }

/* ── Escritorio ── */
.stage { padding: 18px 16px 40px; display: flex; justify-content: center; }
.desk { display: flex; width: 100%; max-width: 1220px; }
.app { display: flex; flex: 1; min-width: 0; height: 840px; border: 1px solid var(--border-strong); border-radius: 18px; overflow: hidden; background: var(--canvas); box-shadow: var(--sombra); position: relative; }
.sbw { width: 252px; flex: none; position: relative; background: var(--sidebar); border-right: 1px solid var(--sidebar-line); }
.sb { position: absolute; inset: 0; background: var(--sidebar); display: flex; flex-direction: column; padding: 10px 8px 8px; z-index: 5; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 6px 10px; }
.logo { width: 28px; height: 28px; border-radius: 9px; background: var(--ink); color: var(--card); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.brandname { font-weight: 650; font-size: 14px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brandname small { display: block; font-weight: 500; font-size: 11px; color: var(--faint); margin-top: -2px; }
.search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 11px; margin-bottom: 8px; border-radius: 99px; background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--shadow-card); color: var(--faint); width: 100%; }
.search:hover { color: var(--dim); }
.searchtxt { flex: 1; font-size: 13px; }
.nav { display: flex; flex-direction: column; gap: 1px; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.row { position: relative; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 99px; color: var(--dim); font-size: 13.5px; font-weight: 520; width: 100%; flex: none; }
.row .ico { color: var(--ic, var(--faint)); display: grid; place-items: center; width: 18px; }
.t-blue { --ic: var(--c-blue); } .t-green { --ic: var(--c-green); } .t-purple { --ic: var(--c-purple); } .t-teal { --ic: var(--c-teal); } .t-mako { --ic: var(--mako); }
.row:hover { background: var(--velo); color: var(--ink); }
.row[aria-current="page"] { background: var(--primary-bg); color: var(--primary-strong); font-weight: 700; }
.row[aria-current="page"] .ico { --ic: var(--primary); }
.lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--primary); color: var(--on-primary); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.sec { margin-top: 8px; }
.hdr { display: flex; align-items: center; gap: 4px; width: 100%; height: 24px; padding: 0 10px; border-radius: 99px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.hdr:hover { color: var(--ink); background: var(--velo); }
.secname { flex: 1; } .secn { font-size: 10.5px; letter-spacing: 0; opacity: .8; }
.hdr .chev { transition: transform .15s; } .sec.open > .hdr .chev { transform: rotate(90deg); }
.sec:not(.open) > .rows { display: none; }
.rows { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
.sec > .hdr .badge { height: 16px; min-width: 16px; font-size: 10px; } .sec.open > .hdr .badge { display: none; }
.cre { width: 20px; height: 20px; } .cre .body { animation: flota 2.8s ease-in-out infinite; }
.cre .eyes { transform-box: fill-box; transform-origin: center; animation: parpadea 3.6s infinite; }
.cre.ops .fill { fill: var(--primary); } .cre.brain .fill { fill: var(--mako); }
@keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.4px); } }
@keyframes parpadea { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.12); } }
@media (prefers-reduced-motion: reduce) { .cre .body, .cre .eyes { animation: none; } }
.foot { border-top: 1px solid var(--sidebar-line); padding-top: 8px; margin-top: 8px; position: relative; }
.me { display: flex; align-items: center; gap: 10px; width: 100%; height: 46px; padding: 0 8px; border-radius: 99px; }
.me:hover, .me[aria-expanded="true"], .me[aria-current="page"] { background: var(--velo); }
.who { flex: 1; min-width: 0; line-height: 1.2; }

  else if (t.kind === 'area') s = `<path d="M10 80 L40 58 L70 66 L100 38 L130 44 L150 20 L150 88 L10 88Z" fill="${c}" opacity=".25"/><path d="M10 80 L40 58 L70 66 L100 38 L130 44 L150 20" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  else if (t.kind === 'table') s = [0, 1, 2, 3].map((i) => `<rect x="14" y="${16 + i * 18}" width="132" height="12" rx="6" fill="${c}" opacity="${i === 0 ? .55 : .22}"/>`).join('');
  else if (t.kind === 'rank') s = [100, 82, 64, 46].map((w, i) => `<circle cx="20" cy="${24 + i * 18}" r="6" fill="${c}" opacity=".5"/><rect x="32" y="${19 + i * 18}" width="${w}" height="10" rx="5" fill="${c}" opacity="${.8 - i * .15}"/>`).join('');
  else if (t.kind === 'line') s = `<path d="M10 70 C40 30 60 74 90 44 S130 24 150 36" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/><path d="M10 82 C40 62 70 80 100 62 S135 56 150 60" fill="none" stroke="${c}" stroke-width="3" opacity=".4" stroke-linecap="round"/>`;
  else if (t.kind === 'heat') s = [0, 1, 2].map((y) => [0, 1, 2, 3, 4].map((x) => `<rect x="${16 + x * 27}" y="${18 + y * 23}" width="22" height="18" rx="5" fill="${c}" opacity="${(.15 + r() * .8).toFixed(2)}"/>`).join('')).join('');
  else if (t.kind === 'funnel') s = [120, 94, 66, 38].map((w, i) => `<rect x="${80 - w / 2}" y="${14 + i * 19}" width="${w}" height="14" rx="7" fill="${c}" opacity="${.85 - i * .17}"/>`).join('');

}

function chartBars(seed, col) { const r = rnd(seed); const v = [...Array(10)].map(() => 30 + r() * 62); return `<svg viewBox="0 0 300 120" aria-hidden="true">${v.map((h, i) => `<rect x="${8 + i * 29}" y="${116 - h}" width="20" height="${h}" rx="7" fill="var(--c-${col})" opacity="${i === 9 ? 1 : .3 + i * .045}"/>`).join('')}</svg>`; }

document.addEventListener('click', (e) => {

  if (!el) { if (st.menu && !e.target.closest('.foot')) { st.menu = false; render(); } return; }
  const [k, ...rest] = el.dataset.act.split(':'), v = rest.join(':');
  switch (k) {
    case 'tab': st.info = null; st.move = false; st.tmpl = false; if (v === 'profile') { st.screen = st.dev === 'phone' ? 'more' : 'dashboard'; st.menu = st.dev === 'desk'; } else { st.screen = v; st.menu = false; } render(true); break;

    case 'old': st.old = !st.old; render(); break;

    case 'go': go(v); break;

    case 'menu': st.menu = !st.menu; render(); break;
    case 'search': openSearch(); break;
    case 'closeSearch': if (e.target === el) closeSearch(); break;

    case 'stage': st.stage = v; render(); break;

    case 'csub': st.csub = v; render(); break;

    case 'tmpl': st.tmpl = true; st.tcat = 'All'; render(); break;
    case 'closetmpl': if (e.target === el || el.classList.contains('rbtn')) { st.tmpl = false; render(); } break;

/* Arrastrar y soltar entre columnas (computadora) */
let drag = null;
document.addEventListener('dragstart', (e) => { const c = e.target.closest && e.target.closest('[data-kind][data-id]'); if (!c || c.getAttribute('draggable') !== 'true') return; drag = { kind: c.dataset.kind, id: c.dataset.id }; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', drag.id); } catch (x) {} });
document.addEventListener('dragover', (e) => { const col = e.target.closest && e.target.closest('.kcol'); if (drag && col && col.dataset.kind === drag.kind) { e.preventDefault(); document.querySelectorAll('.kcol.over').forEach((c) => c !== col && c.classList.remove('over')); col.classList.add('over'); } });
document.addEventListener('drop', (e) => { const col = e.target.closest && e.target.closest('.kcol'); if (drag && col && col.dataset.kind === drag.kind) { e.preventDefault(); moveItem(drag.kind, drag.id, col.dataset.col); } drag = null; });
document.addEventListener('dragend', () => { drag = null; document.querySelectorAll('.kcol.over').forEach((c) => c.classList.remove('over')); });

/* ═══ Buscador (Ctrl K) ═══════════════════════════════════════════════════ */
let sel = 0, list = [];
function index() {
  const out = [];
  tabsVis().forEach((s) => s.tabs.forEach((k) => { const t = T[k], sec = s.id === 'top' ? null : s.label; out.push({ path: [sec, t.label].filter(Boolean), icon: t.icon, hit: () => go(k), kw: (t.was || '') + ' ' + (t.kw || '') }); (t.subs || []).forEach((x) => { if (x !== t.label) out.push({ path: [sec, t.label, x].filter(Boolean), icon: t.icon, hit: () => { go(k); if (k === 'dashboard' && x === 'Templates') { st.tmpl = true; render(); } }, kw: (t.was || '') + ' ' + (t.kw || '') }); }); }));
  Object.entries(M).filter(([, m]) => m.roles.includes(st.role)).forEach(([id, m]) => out.push({ path: ['Photo menu', m.label], icon: m.icon, hit: () => go('profile'), kw: m.was + ' perfil profile' }));
  if (st.role === 'super') PLAT.forEach(([k, l, i]) => out.push({ path: ['Platform', l], icon: i, hit: () => toast(l), kw: '' }));
  return out;
}
function paint() {
  const q = document.getElementById('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  list = index().filter((r) => { const hay = (r.path.join(' ') + ' ' + (r.kw || '')).toLowerCase(); return q.every((w) => hay.includes(w)); }).slice(0, 12);
  sel = Math.min(sel, Math.max(list.length - 1, 0));
  document.getElementById('results').innerHTML = list.length ? list.map((r, i) => `<li><button data-i="${i}" aria-selected="${i === sel}"><span style="color:var(--faint)">${ic(r.icon.startsWith('cre') ? 'bot' : r.icon, 16)}</span><span>${r.path[r.path.length - 1]}</span><span class="p">${r.path.slice(0, -1).join(' › ')}</span></button></li>`).join('') : `<li class="empty">Nada con «${document.getElementById('q').value}».</li>`;
}
function openSearch() { st.menu = false; const o = document.getElementById('ovl'); o.classList.add('on'); o.setAttribute('aria-hidden', 'false'); const q = document.getElementById('q'); q.value = ''; sel = 0; paint(); q.focus(); }
function closeSearch() { const o = document.getElementById('ovl'); o.classList.remove('on'); o.setAttribute('aria-hidden', 'true'); }
function pick(i) { const r = list[i]; if (!r) return; closeSearch(); r.hit(); }
document.getElementById('q').addEventListener('input', () => { sel = 0; paint(); });
document.getElementById('results').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) pick(+b.dataset.i); });
document.addEventListener('keydown', (e) => {
  const on = document.getElementById('ovl').classList.contains('on');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); on ? closeSearch() : openSearch(); return; }
  if (!on) { if (e.key === 'Escape') { if (st.info || st.tmpl || st.menu) { st.info = null; st.tmpl = false; st.menu = false; st.move = false; render(); } } return; }
  if (e.key === 'Escape') closeSearch();
  else if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, list.length - 1); paint(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); paint(); }
  else if (e.key === 'Enter') { e.preventDefault(); pick(sel); }
});

(function boot() {
  /* Atajos: #dashboard #profile #crm #clients #plan #refs · #phone · #dark · #super · #old · #tmpl · #info · #move · #menu (se juntan: #crm,phone,dark) */
  const h = (location.hash || '').slice(1).split(',').filter(Boolean);
  const th = h.includes('dark') ? 'dark' : h.includes('light') ? 'light' : LS.get('mk-coh-theme', 'light');
  document.documentElement.dataset.theme = th === 'dark' ? 'dark' : 'light';
  if (h.includes('super')) st.role = 'super';
  if (h.includes('phone')) st.dev = 'phone';
  if (h.includes('old')) st.old = true;
  ['dashboard', 'profile', 'crm', 'clients', 'plan', 'refs', 'more'].forEach((k) => { if (h.includes(k)) st.screen = k; });
  if (st.dev === 'desk' && h.includes('menu')) st.menu = true;
  if (h.includes('tmpl')) st.tmpl = true;
  if (h.includes('info')) st.info = { kind: st.screen === 'clients' ? 'client' : 'lead', id: st.screen === 'clients' ? 'c6' : 'l6' };
  if (h.includes('move') && st.info) st.move = true;
  if (h.includes('boards')) { st.stage = 'new'; st.tst = 'todo'; }
  render(true);
})();
</script>
</body>
