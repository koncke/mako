<!doctype html>
<meta charset="utf-8">
<!--
  ACA VIVE LA CONFIGURACION DEL PUENTE.

  El dueño: «esto tiene que ir DENTRO del desplegable de la extensión de MaKo… y
  dentro de MaKo simplemente mostrar un aviso cuando esté desconectado. Todo
  minimalista».

  Y hay una razón técnica que lo vuelve mejor y no solo distinto: tres de los
  cuatro pasos hablan del NAVEGADOR, y la web no puede tocarlo. Nunca pudo abrir
  la pestaña de Flow, ni saber si estaba dormida, ni recargarla: solo podía
  pedirlo por escrito. Desde acá se hacen.

  UN PASO POR PANTALLA: un título enorme, como máximo una línea tenue, como
  máximo un botón. Nunca dos cosas que decidir a la vez.
-->
<style>
  :root { color-scheme: light dark; --tinta: #16181d; --tenue: #6b7280; --fondo: #fff; --linea: #e6e8ec; }
  @media (prefers-color-scheme: dark) {
    :root { --tinta: #e8eaee; --tenue: #9aa1ad; --fondo: #1c1e24; --linea: #2c2f37; }
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    width: 300px; margin: 0; padding: 20px 18px 14px;
    background: var(--fondo); color: var(--tinta);
  }
  .marca { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tenue); }

  /* El titulo es la pantalla. Se lee en un segundo y dice que hacer. */
  h1 { font-size: 21px; line-height: 1.2; font-weight: 650; margin: 12px 0 0; letter-spacing: -.01em; }
  h1.numero { font-size: 42px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .tenue { font-size: 12.5px; color: var(--tenue); margin-top: 7px; }

  button {
    display: block; width: 100%; margin-top: 15px; padding: 11px 14px;
    font: inherit; font-weight: 600; cursor: pointer;
    border: 1px solid var(--linea); border-radius: 10px;
    background: #2f6df6; color: #fff; border-color: transparent;
  }
  button.suave { background: transparent; color: var(--tinta); border-color: var(--linea); }
  /* «Guardar en MaKo» (0.77.0): el nombre del lead, que la persona corrige antes de guardar. */
  label.campo { display: block; margin-top: 14px; font-size: 12px; color: var(--tenue); }
  label.campo input {
    display: block; width: 100%; margin-top: 5px; padding: 10px 12px;
    font: inherit; color: var(--tinta); background: transparent;
    border: 1px solid var(--linea); border-radius: 10px;
  }
  label.campo input:focus { outline: 2px solid #2f6df6; outline-offset: 1px; }
  button:disabled { opacity: .55; cursor: default; }

  .pie {
    margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--linea);
    font-size: 10.5px; color: var(--tenue); display: flex; gap: 6px; justify-content: space-between;
  }

  /* Los pasos de una reinstalacion. Es la UNICA pantalla con una lista, y es a
     proposito: no es informacion de contexto, es una receta que hay que seguir en
     orden con las manos. El resto del popup sigue siendo un paso por pantalla. */
  ol.pasos { margin: 12px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.5; }
  ol.pasos li { margin-bottom: 7px; }
  ol.pasos li:last-child { margin-bottom: 0; }
  ol.pasos b { font-weight: 650; }

  /* El latido del estado desconocido: no afirma nada mientras no sabe. */
  .punto { width: 9px; height: 9px; border-radius: 999px; background: var(--tenue); margin-top: 14px; animation: late 1.1s ease-in-out infinite; }
  @keyframes late { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .punto { animation: none; opacity: .6 } }

  /* LA NAVEGACION (26/10/2026, 0.72.0): Inicio (Scraper o Flow) → el registro → una extraccion.
     La flecha vuelve un paso; en Inicio no hay. */
  .cabeza { display: flex; align-items: center; gap: 8px; min-height: 28px; }
  .cabeza .donde { margin-left: auto; font-size: 11px; color: var(--tenue); }
  button.atras {
    display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin: 0; padding: 0 0 2px;
    background: transparent; color: var(--tinta); border: 1px solid var(--linea); border-radius: 8px; font-size: 18px; line-height: 1;
  }
  button.atras[hidden] { display: none; }

  /* Las dos cosas que hace la extension, en Inicio. */
  button.opcion {
    display: flex; align-items: center; gap: 12px; text-align: left; margin-top: 10px; padding: 13px 14px;
    background: transparent; color: var(--tinta); border: 1px solid var(--linea); font-weight: 400;
  }
  button.opcion:hover { border-color: #2f6df6; }
  .opcion .ico { flex: none; width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
  .opcion .ico svg { width: 19px; height: 19px; }
  .opcion .nom { display: block; font-weight: 650; }
  .opcion .sub { display: block; font-size: 12px; color: var(--tenue); margin-top: 1px; }

  /* El estado de WhatsApp Web arriba del registro (como Flow): una linea y, si hace falta, un boton. */
  .estado-wa:empty { display: none; }
  .estado-wa button { margin-top: 10px; }

  /* El registro: una fila por extraccion. */
  .registro { margin-top: 10px; }
  button.fila {
    display: flex; align-items: center; gap: 10px; margin: 0; padding: 10px 2px; text-align: left;
    background: transparent; color: var(--tinta); border: 0; border-bottom: 1px solid var(--linea); border-radius: 0; font-weight: 400;
  }
  .fila .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 13px; }
  .fila .meta { flex: none; font-size: 11.5px; color: var(--tenue); white-space: nowrap; }
  .fila .vivo { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #2f6df6; animation: late 1.1s ease-in-out infinite; }

  /* LA EXTRACCION A LA VISTA: un punto por miembro (o por cada N, en un grupo grande) que se enciende al leerlo, y en azul
     si trae nombre; las fases con su tilde; el conteo grande. */
  h1.grupo { font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
  .conteo { font-size: 34px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 10px; line-height: 1.1; }
  .conteo small { font-size: 13px; color: var(--tenue); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
  .puntos { display: grid; grid-template-columns: repeat(auto-fill, 8px); gap: 3px; margin-top: 12px; }
  .puntos i { width: 8px; height: 8px; border-radius: 50%; background: var(--linea); transition: background-color .35s, transform .35s; }
  .puntos i.v { background: var(--tenue); opacity: .5; }
  .puntos i.n { background: #2f6df6; transform: scale(1.18); }
  ol.fases { list-style: none; padding: 0; margin: 14px 0 0; font-size: 13px; }
  ol.fases li { display: flex; align-items: center; gap: 9px; padding: 3px 0; color: var(--tenue); }
  ol.fases li.hecha { color: var(--tinta); }
  ol.fases li.ahora { color: var(--tinta); font-weight: 600; }
  .marca-fase { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--linea); display: flex; align-items: center; justify-content: center; font-size: 10px; }
  li.hecha .marca-fase { border-color: #1f9d55; background: #1f9d55; color: #fff; }
  li.ahora .marca-fase { border-color: #2f6df6; border-right-color: transparent; animation: gira .8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) {
    .puntos i { transition: none; } li.ahora .marca-fase { animation: none; border-right-color: #2f6df6; } .fila .vivo { animation: none; }
  }
</style>

<div class="cabeza">
  <button id="atras" class="atras" type="button" aria-label="Atrás" title="Atrás" hidden>‹</button>
  <div class="marca">MaKo</div>
  <span id="donde" class="donde"></span>
</div>
<div id="cuerpo"><div class="punto"></div></div>
<div class="pie"><span id="version"></span><span id="ws"></span></div>

<script src="spy-reglas.js"></script>
<script src="perfil-reglas.js"></script>
<script type="module" src="popup.js"></script>
