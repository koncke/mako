<!doctype html>
<meta charset="utf-8">
<!--
  El popup NO configura nada: informa.

  Tenía un campo «Código de conexión», su botón «Conectar» y dos líneas de
  estado. El dueño: «elimina todo esto… dentro de MaKo simplemente mostrar un
  aviso cuando esté desconectado. Todo minimalista».

  El campo era la salida de emergencia del apretón de manos, y por eso se puede
  ir sin perder nada: MaKo le pasa la llave sola desde la página, y los dos casos
  en que eso falla —extensión recién instalada, extensión vieja— NO se arreglaban
  pegando el código; se arreglan recargando o actualizando, que es lo que dice
  MaKo. Un campo que sólo sirve para un camino que ya no se recorre es una puerta
  a un cuarto vacío.

  Queda una línea de estado y, cuando falta algo, el único link que lo arregla.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    width: 224px; padding: 13px 14px; margin: 0;
    background: #fff; color: #16181d;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1e24; color: #e8eaee; }
    .sec { color: #9aa1ad; }
    a { color: #8ab4ff; }
  }
  .marca { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: #9aa1ad; }
  .fila { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 14px; }
  .punto { width: 8px; height: 8px; border-radius: 999px; flex: none; background: #22a558; }
  .punto[data-tono="falta"] { background: #d59b0a; }
  .sec { color: #6b7280; font-size: 12px; margin-top: 7px; }
  a { color: #1a56db; }
</style>
<div class="marca">MaKo</div>
<div class="fila"><span class="punto" id="punto"></span><span id="txt">…</span></div>
<div class="sec" id="sec"></div>
