# =============================================================================
# integracion → main: el typecheck y los tests corren ACÁ, no en la notebook
# =============================================================================
# Por qué (15/10/2026): el chequeo de tipos vivía sólo en el pre-push de la
# notebook de Martín (16 GB), compartida por 10-20 chats de Claude. `tsc` pide
# 3-4 GB; con la máquina en 240 MB libres el push del coordinador moría, y el
# vigía de RAM llegó a matar 46 typechecks en un día. Acá el runner tiene su
# propia RAM y nadie más adentro.
#
# Cómo se usa: se pushea a la rama `integracion` (nunca directo a `main`). Este
# flujo corre tipos, las guardas del push y los tests sobre ESE commit, y si todo
# da verde avanza `main` hasta él por fast-forward. Si `main` se movió por otro
# lado, el fast-forward se rechaza solo (un push sin --force no pisa nada) y hay
# que rebasar `integracion` sobre `origin/main`.
#
# Costo: el repo es privado de una cuenta Free: 2.000 minutos por mes incluidos y
# SIN medio de pago. Si se acaban, los runs dejan de correr y no se cobra nada —
# pero `main` deja de avanzar: el camino de emergencia es pushear directo a
# `main` con el pre-push COMPLETO (corre el tsc local). Ver AGENTS.md.
#
# `concurrency` cancela el run viejo cuando llega un push nuevo: se chequea sólo
# la punta, que contiene a lo anterior. Así no se gastan minutos en commits que
# ya quedaron atrás.
# =============================================================================
name: integracion → main

on:
  push:
    branches: [integracion]
  workflow_dispatch:

concurrency:
  group: integracion
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  chequear-y-avanzar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # En la notebook, tsc ve los tipos de las rutas que deja `.next/` (y el
      # next-env.d.ts): los dos están en .gitignore. Acá se generan.
      - name: Tipos de las rutas
        run: npx next typegen

      # ⚠️ FALLAR RÁPIDO (17/10/2026). De los 90 runs, 16 fallaron, y 12 de esos 16 fueron un TEST de otra área que
      # lee el código como texto o un barrido global; cada uno se veía recién a los ~11 min (Tests: 508 s, Tipos: 137 s)
      # y se llevó 15. Ahora las guardas (segundos) y los tests que lo CAMBIADO puede romper corren PRIMERO
      # (scripts/tests-afectados.mjs: barredoras + los que nombran o importan un archivo cambiado, contra
      # origin/main = el último verde): un rojo se ve en ~3 min. Después Tipos, y por último los demás tests: la suma
      # de las dos fases es la suite entera (`npm test`), y ninguno corre dos veces — por eso esto también AHORRA minutos
      # (los fallidos se llevaron 140 de los 2.000 del mes en 2 días). Si el script no puede calcular (código 2), no se
      # pierde cobertura: la segunda fase cae a `npm test` completo.
      #
      # ⚠️ MEDIDO con la API (/actions/runs/{id}/timing) el 17/10/2026: el ROJO bajó de 5-10 a 2 min facturables (run 94: 107 s), pero el
      # VERDE subió de ~11 a 14 (run 95: 781 s; afectados 333 s + Tipos 148 s + los demás 217 s + npm ci 29 s + checkout 29 s) y es ~85 %
      # de los runs. Causa: `--concurrencia auto` dejaba el default de node (núcleos − 1 = UN proceso en un runner de 2 vCPU) y las
      # tandas chicas sumaban 42 s de arranques. Ahora `auto` = todos los núcleos (2-4 procesos), y los demás tests van en UNA sola
      # corrida de `node --test` (--tanda 1000): sin arranques por tanda y sin núcleos parados al final de cada una.
      #
      # ⚠️ Y NO ALCANZÓ (run 102, el primer verde con ese recorte): 12 min facturables, 683 s, contra 14 y 781 s. Los números: el run 101 (rojo en Tipos) sumó
      # 477 s = ~64 s de arranque + afectados 270 s + tipos 143 s, o sea que los afectados bajaron 333 → 270 s y los demás casi nada (217 → ~206 s):
      # con 2 procesos casi no se ganó. El costo es el ARRANQUE de cada archivo de test (node + tsx + compilar: ~0,4 s × ~1.100 archivos ≈ lo que tardaba
      # `npm test`), no el cómputo, y las ~150 barredoras que releen los mismos 5.400 archivos. Lo que lo evita es correr los tests que no tocan estado
      # global JUNTOS en un proceso (`--compartir`, scripts/cache-lecturas.cjs): localmente la suite entera pasó de ~50 min a 260 s. EXPERIMENTO a medir en el
      # run que sigue: los afectados comparten sólo sus barredoras (`--compartir=barredoras`: lo que más pesa y menos riesgo tiene) y los demás comparten todo
      # lo compartible (`--compartir`). Todo rojo de un proceso compartido se repite AISLADO antes de contarse. Si algo raro: `--sin-compartir` vuelve a como era.
      #
      # Y los DATOS DEL RUN 102 (job completo, 676 s: checkout 15 + setup-node 4 + npm ci 29 + guardas 10 + afectados 279 + tipos 154 + los demás 182; runner de
      # 2 CPU y 7,9 GB) afinan el diagnóstico: afectados = 489 archivos en 13 tandas de 40 → 0,57 s por archivo; los demás = 653 archivos en UNA corrida → 0,28 s
      # por archivo. Los 13 arranques de tanda explican ~20 s, no la diferencia: la explican las ~150 barredoras (~1,2 s de reloj cada una). Y los 0,28 s de los
      # demás son, sobre todo, el ARRANQUE de cada archivo (node + tsx), que sólo se evita compartiendo proceso. Por eso AMBAS fases comparten todo lo
      # compartible (en la fase 1 siguen aislados, por su propio proceso, los tests que el cambio mismo toca y los que tocan el entorno), y la fase 1 va con
      # tandas de 100 (había 6 GB libres: las de 40 eran de la notebook). Estimación SIN medir en Linux: ~7-9 min facturables.
      - name: Guardas del push
        run: sh scripts/guardas-push.sh origin

      - name: Tests afectados por lo que cambió (fallar rápido)
        run: |
          set +e
          echo "runner: $(nproc) CPU, $(free -m | awk '/Mem:/ {print $2}') MB de RAM"
          SECONDS=0
          node scripts/tests-afectados.mjs --base origin/main --cortar --concurrencia auto --tanda 100 --compartir
          c=$?
          echo "afectados: $SECONDS s (código $c)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$c" -eq 2 ]; then echo "::warning::no pude calcular los tests afectados: la fase siguiente corre la suite completa"; exit 0; fi
          exit $c

      # ⚠️ 21/10/2026, run 200 (06ce1cb25): «Tipos» murió con exit 134 a los 297 s, con 5.082 MB de los 5.120 del tope («heap out of memory»); los runs
      # anteriores habían pasado a los 177-213 s: el programa está en el borde del tope desde hace días, y el tope sube cada vez que lo cruza
      # (2048 → 3072 → 4096 → 5120 el 13-14/10). Un OOM se veía IGUAL que un error de tipos (un paso rojo y un email). Ahora el paso corre
      # scripts/tipos-ci.mjs: el tope se deriva de la RAM del runner (RAM − 1,5 GB = 6.144 en el de 7,9 GB; TIPOS_HEAP_MB lo fuerza), el resultado se dice con
      # una palabra y un exit (0 ok · 1 ERRORES DE TIPOS · 98 SIN MEMORIA / MATADO: no son errores de tipos), y cada run deja una línea `TIPOS-MEDIDA` con la memoria
      # VIVA real y el tamaño del programa (con un warning desde el 80 % del tope). Qué infla el programa y cómo achicarlo: docs/hallazgos-infra.md.
      #
      # ⚠️ DESDE LA NOCHE DEL 21/10/2026 «Tipos» ES SIEMPRE EL TSC ENTERO (criterio del Cerebro: el paso que FRENA el push no puede dar un OK falso). TIPOS_TANDAS=4 ya NO reparte el chequeo: es el RESPALDO si el
      # entero muere por memoria (98) y su OK sale «OK PARCIAL» (línea TIPOS-MEDIDA con parcial=1, ::warning:: y el resumen), nunca limpio. Por qué: las tandas pueden perder un error que el checker cachea (TS2589/
      # TS2303) y en ESTE repo lib/ es UN ciclo de imports de 580 archivos (el 17 % del peso) que queda partido entre las tandas 1 y 2: el revisor reprodujo «Tipos: OK» con exit 0 donde el tsc da 2. Costo en minutos
      # del respaldo: el intento del entero que muere gasta ~3 min más por run (~300-500 min/mes con 20-35 runs/semana); TIPOS_SOLO_TANDAS=1 lo salta (sabiendo que entonces es SIEMPRE parcial). Hoy el entero entra
      # (5.065 MB de 6.144) y el respaldo no corre. Lo que sigue es la historia de la medición de las tandas:
      #
      # ⚠️ TIPOS_TANDAS=4 (21/10/2026, medido en Actions: run 39603272529 de medir-tipos.yml, runner de 2 CPU y 7.932 MB). El tsc completo pedía 5.065 MB vivos (82 % del tope, 159 s). Repartido en
      # tandas —cada una crea el programa entero (el piso: 2.406 MB) y chequea un pedazo— el pico por proceso baja a: 2 tandas 4.102 MB (67 %, 174 s) · 3 tandas 3.685 (60 %, 200 s) · 4 tandas 3.535
      # (58 %, 227 s). Se eligió 4: con 3 el pico queda justo en el criterio (≤ 60 % del tope) y se pasa en una o dos semanas; las 4 cuestan ~68 s más por run (159 → 227 s) y dejan ~1.200 MB más de aire.
      # El warning del 80 % mira la tanda MÁS PESADA. ⚠️ Es una prórroga de semanas, no la solución: el piso (el programa atado, 47 % del pico) crece con el repo y ninguna cantidad de tandas
      # lo baja. Para volver al tsc de siempre: sacar esta línea (o TIPOS_TANDAS=1).
      #
      # ⚠️ Las tandas NO son «lo mismo que el tsc» en todos los casos (revisión del 21/10/2026): el checker cachea algunos errores (TS2589 una instanciación profunda, TS2303 un alias circular) y los atribuye
      # al primer archivo que los dispara; si ese es de OTRA tanda se perdían y el paso decía «OK» donde el tsc da exit 2 (Vercel tiene ignoreBuildErrors: nada más lo frena). Se reparte en el orden del programa
      # para evitarlo y las dos repros dan error, pero con un ciclo de imports que cruce tandas puede volver a pasar: es «igual salvo ciclos raros». Sólo un tsc entero lo garantiza: docs/hallazgos-infra.md.
      - name: Tipos
        env:
          TIPOS_TANDAS: '4'
        run: |
          set +e
          SECONDS=0
          node scripts/tipos-ci.mjs
          c=$?
          echo "tipos: $SECONDS s (código $c)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $c

      - name: Tests (los demás)
        run: |
          set +e
          SECONDS=0
          node scripts/tests-afectados.mjs --base origin/main --resto --concurrencia auto --tanda 1000 --compartir
          c=$?
          echo "los demás: $SECONDS s (código $c)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$c" -eq 2 ]; then echo "::warning::sin plan de afectados: corro la suite completa"; npm test; exit $?; fi
          exit $c

      - name: Avanzar main (sólo fast-forward)
        run: |
          if ! git push origin "HEAD:refs/heads/main"; then
            echo "::error::main avanzó por otro lado y no es fast-forward. Rebaseá integracion sobre origin/main y volvé a pushear."
            exit 1
          fi
