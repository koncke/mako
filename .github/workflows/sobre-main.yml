# =============================================================================
# Chequeo sobre main: los tipos enteros y las barredoras, sobre la MEZCLA que llegó a main sin probar
# =============================================================================
# Por qué (docs/hallazgos-infra.md → «Por qué tardaba horas»): 8 de 10 verdes de punta llegaron a main con una mezcla que nadie
# probó. punta.yml mezcla el main del momento, corre los tests y los tipos, y si al empujar main ya se había movido, mezcla
# OTRA VEZ y empuja sólo con las guardas (su `::warning::`). Dos puntas que no chocan como texto se pueden romper entre sí, y
# lo veía recién la punta siguiente.
#
# CUÁNDO CORRE (6/11/2026; Martín: «Cuanto vamos a gastar en github? No quiero que pase lo de Vercel»):
#   · UNA VEZ POR DÍA, a las 09:47 UTC: antes del despliegue diario de las 11:05 UTC (lib/desplegar-main.ts), que lee la marca
#     `ci-rojo/main` y NO compila mientras main esté rojo. Hasta el 6/11 lo lanzaba punta.yml con cada mezcla que no probó (126
#     corridas y 1.437 min del 1 al 6/11): ahora producción compila una vez por día, y lo que importa es el main que se va a
#     desplegar, no cada mezcla. Lo que eso cuesta: docs/hallazgos-infra.md → «Los minutos de GitHub Actions».
#   · a mano (`workflow_dispatch`): `gh workflow run sobre-main.yml --ref main`, o el botón en Actions. Sirve para ver YA si main
#     está rojo cuando una punta da rojo en algo que no tocó.
#   · ⚠️ Ya NO corre con un push a main (el camino de emergencia): esa mezcla la mira la corrida del día, antes de desplegarse.
#   · `concurrency` sin cancelar: corre uno y espera UNO; el que espera chequea el main que haya cuando arranca (checkout de
#     `main`, no del commit que lo lanzó).
#   · ⚠️ GitHub puede atrasar un `schedule` (en horas pico, 10-30 min): 09:47 deja ~78 min, que alcanzan para la corrida (~12 min)
#     y para el relanzamiento por máquina. Si un día no terminó a las 11:05, el despliegue no ve la marca y compila (ante la duda).
#
# QUÉ CORRE: los tipos enteros (como la punta: swap, 12 GB de tope, tandas de respaldo) y todas las barredoras compartidas
# (`tests-afectados.mjs --barredoras`): son las que una mezcla rompe sin que ninguna de las dos puntas lo vea. Los demás tests
# los ve la suite de cada noche.
#
# QUÉ DEJA: rojo → la marca `ci-rojo/main` (la lee punta.yml: una punta que da rojo mientras existe deja `espera-main/<punta>`
# y se relanza sola; y la lee el despliegue diario, que NO compila mientras exista). Verde → `scripts/ci-main-verde.sh`: borra la marca y relanza las que esperaban. Sin minutos de deploy:
# `ci-rojo/**` y `espera-main/**` no construyen en Vercel (vercel.json).
# =============================================================================
name: chequeo sobre main

on:
  schedule:
    # 09:47 UTC (06:47 de Argentina), antes del despliegue de las 11:05 UTC. Un minuto «raro»: a las en punto GitHub se atrasa.
    - cron: '47 9 * * *'
  workflow_dispatch:
    inputs:
      # «maquina»: la relanzó «Relanzar si la máquina no llegó a los tipos». Una corrida así no se vuelve a relanzar.
      relanzo:
        description: 'Quién la relanza (vacío: una punta o una persona)'
        required: false
        default: ''

concurrency:
  group: sobre-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  mezcla-de-main:
    runs-on: ubuntu-latest
    # Mayor que la suma de los pasos largos (18 + 15) más lo demás: si se pasa un paso, es un fallo del paso y deja la marca.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar
        run: npm ci --no-audit --no-fund

      - name: Tipos de las rutas
        run: npx next typegen

      - name: Swap para los tipos
        run: |
          sudo fallocate -l 6G /swapfile-tipos
          sudo chmod 600 /swapfile-tipos
          sudo mkswap /swapfile-tipos
          sudo swapon /swapfile-tipos

      - name: Tipos
        id: tipos
        timeout-minutes: 18
        env:
          TIPOS_TANDAS: '4'
          TIPOS_HEAP_MB: '12288'
          # Como en punta.yml: a los 14 min corta el script y dice «SIN TIEMPO» (97), con la memoria de ese momento.
          TIPOS_TOPE_S: '840'
        run: |
          set +e
          echo "empezo=si" >> "$GITHUB_OUTPUT"
          SECONDS=0
          node scripts/tipos-ci.mjs
          c=$?
          if [ "$c" = "97" ]; then echo "salida=sin-tiempo" >> "$GITHUB_OUTPUT"; else echo "salida=otra" >> "$GITHUB_OUTPUT"; fi
          echo "tipos sobre main $(git rev-parse --short HEAD): $SECONDS s (código $c)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $c

      # ⚠️ El 0 solo no alcanza, igual que en punta.yml: se exige la línea del verde con tests adentro.
      - name: Barredoras, compartidas
        id: barredoras
        if: "!cancelled()"
        timeout-minutes: 15
        env:
          MAKO_TIEMPOS_TESTS: ${{ runner.temp }}/tiempos-tests.tsv
        run: |
          set +e
          SECONDS=0
          { node scripts/tests-afectados.mjs --barredoras --base HEAD --concurrencia auto --tanda 100 --compartir; echo $? > "$RUNNER_TEMP/barredoras.codigo"; } 2>&1 | tee "$RUNNER_TEMP/barredoras.log"
          c=$(cat "$RUNNER_TEMP/barredoras.codigo")
          echo "barredoras sobre main: $SECONDS s (código $c)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$c" != "0" ]; then exit "$c"; fi
          if ! grep -Eq 'VERDE · [1-9][0-9]* tests' "$RUNNER_TEMP/barredoras.log"; then
            echo "::error::tests-afectados --barredoras salió con 0 sin correr ningún test: eso no es un verde."
            exit 1
          fi

      - name: Main está verde
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/ci-main-verde.sh origin

      # Quién llegó a main en las últimas horas, y quién llegó con un veredicto de la nube (scripts/veredicto.mjs): un rojo acá es de
      # una mezcla, y sin esta lista no hay a quién preguntarle. El checkout es de un solo commit: se trae la historia que hace falta.
      # Un tsc que no terminó a tiempo es la máquina, no main: se relanza una vez y no se marca main en rojo (punta.yml hace lo mismo).
      - name: Relanzar si la máquina no llegó a los tipos
        id: relanzar
        if: >-
          failure() && steps.tipos.outputs.empezo == 'si' && steps.tipos.outputs.salida != 'otra'
          && steps.barredoras.outcome != 'failure' && github.event.inputs.relanzo != 'maquina'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh workflow run sobre-main.yml --ref main -f relanzo=maquina; then
            echo "relanzada=si" >> "$GITHUB_OUTPUT"
            echo "::warning title=Tipos: la máquina no llegó (no es main)::El tsc no terminó a tiempo en este runner. La corrida se relanzó una vez; main no queda marcado en rojo por esto."
          else
            echo "::warning::No pude relanzar el chequeo sobre main: queda rojo, pero los tipos no dieron error (SIN TIEMPO)."
          fi

      - name: Main está rojo
        if: failure() && steps.relanzar.outputs.relanzada != 'si'
        run: |
          sha=$(git rev-parse HEAD)
          git fetch --quiet --deepen=400 origin main || true
          {
            echo "### Llegaron a main en las últimas 3 horas"
            git log --since=3.hours --format='- %h %s' --grep='^Merge origin/main en punta/' HEAD | head -30
            echo "### De esos, con un veredicto de la nube (los tests y los tipos los corrió la sesión, no Actions)"
            git log --since=3.hours --format='%h %(trailers:key=Veredicto,valueonly,separator=%x20)' HEAD | awk 'NF > 1 { q = "?"; for (i = 2; i <= NF; i++) if ($i ~ /^quien=/) q = substr($i, 7); print "- " $1 " · sesión " q }' | head -30
          } >> "$GITHUB_STEP_SUMMARY" || true
          git push --force origin "$sha:refs/heads/ci-rojo/main"
          echo "**El despliegue diario (11:05 UTC) no compila mientras main esté rojo:** producción queda en la versión anterior. Lo urgente sale con scripts/desplegar-ya.mjs." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::La mezcla de main $(git rev-parse --short HEAD) dio rojo (tipos o barredoras). El despliegue diario queda frenado hasta que main vuelva a verde. Las puntas que den rojo mientras tanto se relanzan solas cuando main vuelva a verde."
