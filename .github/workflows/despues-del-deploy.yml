# =============================================================================
# Después del deploy: un deploy de producción que falla deja una corrida ROJA, y producción pasa la prueba de humo
# =============================================================================
# Por qué (docs/hallazgos-infra.md → «Por qué tardaba horas»): el 3/11/2026 un deploy roto pasó 6 h sin que nada lo dijera.
# `main` avanzaba, el build de Vercel moría, y producción seguía sirviendo la versión anterior: no se rompe nada para el
# cliente y TAMPOCO LLEGA NADA. Lo que ve el vigía —y GitHub, que manda el mail de una corrida que falló— son las corridas
# rojas de Actions: por eso un deploy fallido tiene que terminar acá como una corrida roja, no como un aviso que nadie abre.
#
# ⚠️ SIN EVENTOS DE VERCEL (6/11/2026; Martín: «Cuanto vamos a gastar en github? No quiero que pase lo de Vercel»). Hasta ese
# día escuchaba `deployment_status` y `repository_dispatch` (vercel.deployment.*): 623 corridas del 1 al 6/11, casi todas de
# previews o de estados intermedios que ningún job atendía. GitHub NO deja filtrar `deployment_status` por ambiente antes de
# arrancar la corrida (no tiene `types` ni filtros), y `repository_dispatch` filtra por tipo pero no por ambiente: cada evento era
# una corrida. Desde el 6/11 producción compila UNA vez por día (11:05 UTC, lib/desplegar-main.ts), así que alcanza con mirar
# DESPUÉS de esa hora: la corrida de las 11:37 UTC lee cómo terminó el último deploy de producción (los deployments que Vercel
# le escribe a GitHub, por la API) y corre el humo. Las de cada 8 h repiten lo mismo, y lo que despliega `scripts/desplegar-ya.mjs`
# a deshora lo ve la siguiente. Lo que se gasta: docs/hallazgos-infra.md → «Los minutos de GitHub Actions».
#
# QUÉ CORRE, en UN job (cada job factura su minuto redondeado: con uno solo, una corrida son ~2 min):
#   · El último deploy de producción: si su último estado es failure / error → ::error y rojo.
#   · Humo: scripts/humo-produccion.mjs contra hola-mako.com. SÓLO ALARMA: nunca hace rollback (un rollback servía en 2 de 16
#     incidentes, y uno automático sobre un falso rojo saca un arreglo bueno de producción). Y NO VE lo que está detrás de la
#     sesión: es una alarma de caída total, nada más.
#   · ¿Producción se actualiza?: main recibió commits hace entre 72 y 26 h y no hubo ni un deploy de producción en 72 h → rojo,
#     diciendo si es porque main está rojo (el despliegue diario frenado) o porque Vercel dejó de escribirle a GitHub.
#   · Las redes de cada noche (semanal-tests.yml y tipos-respaldo.yml) dan veredicto: 36 h sin uno, con commits nuevos, es rojo.
#   · Los minutos de Actions del mes (scripts/minutos-actions.mjs): al 80 % del tope, rojo, para que no se corte por sorpresa.
#   Cada paso corre aunque el anterior haya dado rojo (`!cancelled()`): una corrida muestra todo lo que está mal.
# =============================================================================
name: después del deploy

on:
  schedule:
    # 11:37 UTC: media hora después del despliegue diario (11:05; una compilación tarda ~4 min). Minutos «raros»: a las en
    # punto GitHub encola de más y se atrasa.
    - cron: '37 11 * * *'
    # Y cada 8 h: una caída de producción, o un deploy hecho a mano a deshora.
    - cron: '23 */8 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Dónde correr el humo (por defecto, https://hola-mako.com)'
        required: false
        default: 'https://hola-mako.com'

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  vigia:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Sólo los dos scripts: el repo entero son minutos de checkout para correr dos archivos. El node que trae el runner alcanza.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/humo-produccion.mjs
            scripts/minutos-actions.mjs
          sparse-checkout-cone-mode: false

      # Los deployments que Vercel le escribe a GitHub (el mismo dato que antes llegaba como `deployment_status`). Vercel nombra el
      # ambiente «Production» (o «Production – <proyecto>»): se compara sin mayúsculas, igual que hacía el `contains` de antes.
      - name: El último deploy de producción
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          dep=$(gh api "repos/$REPO/deployments?per_page=100" --jq '[.[] | select(.environment | ascii_downcase | contains("production"))] | sort_by(.created_at) | reverse | .[0] // empty | "\(.id) \(.sha) \(.created_at)"')
          if [ -z "$dep" ]; then
            echo "No hay deploys de producción en GitHub: lo mira «¿Producción se actualiza?»." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -- $dep
          id=$1; sha=$2; cuando=$3
          estado=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0] | "\(.state // "") \(.target_url // .environment_url // "")"')
          set -- $estado
          st=${1:-sin-estado}; url=${2:-}
          echo "Último deploy de producción: commit ${sha} (${cuando}) · ${st} ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$st" in
            failure|error)
              {
                echo "### ✖ El deploy de producción falló"
                echo ""
                echo "- Commit: \`${sha}\` (${cuando})"
                echo "- Deploy: ${url:-sin link}"
                echo ""
                echo "Producción sigue sirviendo la versión anterior: lo de este commit NO llegó a nadie. Mirá el log del build en Vercel."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::El deploy de producción del commit ${sha} falló (${st}). Producción sigue en la versión anterior. ${url}"
              exit 1
              ;;
          esac

      - name: Humo de producción
        if: "!cancelled()"
        env:
          HUMO_URL: ${{ github.event.inputs.url || 'https://hola-mako.com' }}
        run: |
          set +e
          # Justo después de un deploy el alias puede tardar: el script ya reintenta cada chequeo una vez a los 10 s.
          node scripts/humo-produccion.mjs | tee humo.txt
          c=${PIPESTATUS[0]}
          grep -v '^::' humo.txt >> "$GITHUB_STEP_SUMMARY"
          exit $c

      # Una compilación por día: un commit de main de hace más de 26 h ya tuvo su despliegue de las 11:05. Si en 72 h no hubo
      # NINGUNO, o el despliegue está frenado (main rojo), o Vercel dejó de escribirle a GitHub y el primer paso quedó ciego.
      # ⚠️ Falsa alarma posible: 46 h seguidas de commits que sólo tocan documentos (el despliegue diario no compila por eso).
      - name: ¿Producción se actualiza?
        if: "!cancelled()"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          desde=$(date -u -d '72 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          hasta=$(date -u -d '26 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          commits=$(gh api "repos/$REPO/commits?sha=main&since=$desde&until=$hasta&per_page=1" --jq 'length')
          deploys=$(gh api "repos/$REPO/deployments?per_page=100" --jq "[.[] | select((.environment | ascii_downcase | contains(\"production\")) and .created_at >= \"$desde\")] | length")
          echo "Commits en main (72 a 26 h atrás): $commits · deploys de producción en 72 h: $deploys" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$commits" != "0" ] && [ "$deploys" = "0" ]; then
            if gh api "repos/$REPO/git/ref/heads/ci-rojo/main" --jq .object.sha >/dev/null 2>&1; then
              echo "::error::Producción no se actualiza hace 72 h: main está ROJO (ci-rojo/main) y el despliegue diario está frenado. Arreglá main (el chequeo sobre main dice qué) o desplegá a mano con scripts/desplegar-ya.mjs."
            else
              echo "::error::main recibió commits y no hubo ningún deploy de producción en 72 h: o el cron /api/cron/desplegar-main no está compilando, o Vercel dejó de escribirle los deploys a GitHub (Project Settings → Git) y el aviso de deploy fallido está ciego. Si en esos días sólo entraron documentos, es una falsa alarma."
            fi
            exit 1
          fi

      # ── LAS REDES DE CADA NOCHE (4/11/2026) ──────────────────────────────────────────────────────────────────────────
      # semanal-tests.yml y tipos-respaldo.yml corren cada noche si entró algo a main. Una red que no da veredicto no avisa: se queda
      # callada (el 2/11 la suite semanal la canceló su techo sin un mail, y el respaldo de tipos no había dado ninguno). Un veredicto
      # es una corrida verde o ROJA; una cancelada, sin arrancar o sin minutos, no. 36 h sin veredicto y con commits nuevos = rojo.
      - name: ¿Las redes de cada noche dan veredicto?
        if: "!cancelled()"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          limite=$(date -u -d '36 hours ago' +%s)
          alarma=0
          for wf in semanal-tests.yml tipos-respaldo.yml; do
            ultimo=$(gh api "repos/$REPO/actions/workflows/$wf/runs?status=completed&per_page=30" --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].created_at // ""')
            if [ -n "$ultimo" ] && [ "$(date -u -d "$ultimo" +%s)" -ge "$limite" ]; then
              echo "$wf: último veredicto $ultimo." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            desde="${ultimo:-$(date -u -d '36 hours ago' +%Y-%m-%dT%H:%M:%SZ)}"
            nuevos=$(gh api "repos/$REPO/commits?sha=main&since=$desde&per_page=1" --jq length)
            if [ "$nuevos" != "0" ]; then
              echo "::error::$wf no da veredicto desde ${ultimo:-hace más de 36 h} y main recibió commits: la red de esa noche está muda. Mirá sus corridas (canceladas, sin minutos o sin arrancar)."
              alarma=1
            else
              echo "$wf: sin veredicto en 36 h, pero main no recibió commits: no hay nada que juzgar." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit $alarma

      # ── LOS MINUTOS DEL MES (6/11/2026) ───────────────────────────────────────────────────────────────────────────────
      # El tope de gasto de Actions (US$30) se agotó una vez, y con el tope agotado ninguna punta llega a main. Esto lo avisa al 80 %.
      #
      # ⚠️ EL ROJO SALE DEL NÚMERO DE GITHUB, NO DE LA ESTIMACIÓN (arreglado el 6/11/2026). Hasta ese día esto daba rojo TODOS los
      # días: estimaba US$52,07 contra US$15,94 del panel (3,3x). Dos cosas lo causaban, y las dos estaban acá:
      #   · `ACTIONS_INCLUIDOS: '0'` — el plan Free del repo privado trae 2.000 minutos incluidos (AGENTS.md) y se cobraban todos.
      #   · la estimación por duración de la corrida sobre-cuenta ~1,9x (incluye la cola y los huecos entre jobs; GitHub factura
      #     por JOB). Ahora el script lee el facturable REAL en `/actions/workflows/{id}/timing` y la alarma juzga ESE número.
      # No se tocó el umbral del 80 %: subirlo apaga el síntoma y deja la alarma mintiendo.
      # El tope, el precio y los minutos incluidos se pueden cambiar con variables del repo (Settings → Variables) sin tocar esto.
      - name: ¿Cuántos minutos de Actions van este mes?
        if: "!cancelled()"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTIONS_TOPE_USD: ${{ vars.ACTIONS_TOPE_USD || '30' }}
          ACTIONS_PRECIO_MIN: ${{ vars.ACTIONS_PRECIO_MIN || '0.006' }}
          ACTIONS_INCLUIDOS: ${{ vars.ACTIONS_INCLUIDOS || '2000' }}
        run: |
          node scripts/minutos-actions.mjs --repo "$REPO" --alarma 80 --resumen "$GITHUB_STEP_SUMMARY"
