# =============================================================================
# medir tipos — UNA medición en Actions de cómo se reparte la memoria del chequeo de tipos
# =============================================================================
# Por qué (21/10/2026): el paso «Tipos» de integracion.yml pasó de ~2 GB a 5,06 GB de memoria viva en ocho días (run 203: vivo_mb=5062 de un tope de 6.144, 7.723 archivos). El runner tiene 7,9 GB y el
# programa crece ~1 GB por semana: subir el tope otra vez es esperar al próximo OOM. El arreglo de fondo se elige con UN número que sólo se puede medir acá (hacen falta ≥ 7 GB libres): cuánto baja el pico
# por proceso si el chequeo se reparte en 2, 3 o 4 tandas, si partir tests/ del resto alcanza, y qué archivos son los más lentos de chequear. scripts/medir-tipos.mjs lo mide y lo deja en el log y en el
# resumen del run (líneas `MEDIDA-TIPOS …` y una tabla).
#
# Cómo se usa: se pushea la rama `medir-tipos` (o se dispara a mano con «Run workflow»). NO corre en `integracion` ni en `main`, NO escribe nada en el repo (permisos de sólo lectura) y no avanza nada.
# Cuesta ~15-20 minutos de runner UNA vez (de los 2.000 del mes). Después de leer los números, esta rama se borra.
# =============================================================================
name: medir tipos

on:
  push:
    branches: [medir-tipos]
  workflow_dispatch:

concurrency:
  group: medir-tipos
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Igual que integracion.yml: tsc ve los tipos de las rutas que deja `.next/` y el next-env.d.ts, que están en .gitignore.
      - name: Tipos de las rutas
        run: npx next typegen

      - name: Medir
        run: |
          echo "runner: $(nproc) CPU, $(free -m | awk '/Mem:/ {print $2}') MB de RAM"
          node scripts/medir-tipos.mjs
