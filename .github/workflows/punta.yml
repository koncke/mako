# =============================================================================
# punta → main: cada punta se chequea sola, y llega a main sola si da verde
# =============================================================================
# Martín, 3/11/2026, con 47 commits frenados por ocho corridas rojas seguidas de `integracion`: «Y no podemos hacer
# que entren en diferentes testeos en github? Entonces se va deployando lo que ya pasó en lugar de todo junto...
# Esto como regla». Memoria: `cada-punta-se-chequea-sola`.
#
# Por qué: el tren junta todo y corta en el primer grupo rojo. Una punta con un test viejo deja afuera a las que
# estaban bien, y cada error aparecía recién al arreglar el anterior. Acá una punta roja vuelve a su chat y no frena
# a nadie más.
#
# Cómo se usa: se pushea a una rama `punta/<nombre>`. Este flujo mezcla el main de ese momento, chequea LO QUE LA
# PUNTA CAMBIÓ y, si da verde, empuja a `main`. Un retoque seguido de la misma punta cancela la corrida vieja
# (`concurrency`): no se pagan dos.
#
# ⚠️ «LOS DEMÁS» TESTS NO VAN ACÁ. Son los que lo cambiado no puede romper, y corren una vez por semana en
# `semanal-tests.yml`. Lo decidió Martín el 21/10/2026 (memoria `chequeo-github-modular`): «Lo que vaya a main no
# puede dar un OK falso; un chequeo completo nocturno o semanal queda de red». Por eso este flujo sí exige los
# afectados, las guardas y los tipos, y no tiene ningún camino que los dé por buenos sin haberlos visto correr.
#
# ⚠️ ESA RED NO ESTABA DANDO VEREDICTO (medido con la API el 3/11/2026), y sin `--resto` es la única que ve esos tests.
# semanal-tests.yml: el 2/11 la canceló su propio techo de 20 min, sin veredicto y sin mail. tipos-respaldo.yml: nunca dio uno
# (26/10 sin minutos, 2/11 murió en `fallocate /swapfile`). Y hacen falta: en `integracion`, «los demás» cazó rojos de verdad
# (corridas 385 y 389), y «Tipos» viene saliendo OK PARCIAL. Las dos se arreglaron en este commit; tests/punta-ci.test.ts fija
# que puedan dar un veredicto.
#
# ⚠️ Y DESDE EL 4/11/2026 HAY UN CAMINO MÁS, ATADO AL ÁRBOL: EL VEREDICTO (scripts/veredicto.mjs). Martín, por el Cerebro: «Por que
# actions subió tanto?... Y estamos con 1 sola cuenta, imagina que tengo 5 cuentas... Que los chats en la nube hagan los testeos o algo
# así...». Una sesión de la nube corre los tests afectados y el tsc entero con Node 24 y lo deja en un renglón `Veredicto:` del último
# commit; Actions deja el suyo en la caché de la rama. Este flujo lo ata al árbol, a la base y a la selección, y repite SÓLO lo que la
# mezcla con main pudo cambiar (más una muestra, si es de la nube). Lo que no corrió acá lo vuelve a mirar sobre-main.yml en main: la
# punta llega «sin probar». Sin veredicto que valga, corre todo como siempre. El detalle, en docs/hallazgos-infra.md → «Actions sin repetir».
#
# Costo: quedaban ~2.260 min de Actions para noviembre (medido el 3/11, estimado). Subir el tope es un pago y lo
# decide Martín. Los pushes a `punta/**` y `ci-rojo/**` NO construyen en Vercel (`git.deploymentEnabled`, en
# vercel.json): cada build cuesta, y sólo `main` va a producción.
# =============================================================================
name: punta → main

on:
  push:
    branches: ['punta/**']
  # Lo usa scripts/ci-main-verde.sh para RELANZAR una punta que dio rojo mientras main estaba rojo, cuando main vuelve a verde
  # (sobre-main.yml). Se lanza sobre la rama de la punta: todo lo de abajo lee GITHUB_REF_NAME y HEAD, igual que con un push.
  workflow_dispatch:
    inputs:
      # «maquina»: la relanzó «Relanzar si la máquina no llegó a los tipos». Una corrida así no se vuelve a relanzar.
      relanzo:
        description: 'Quién la relanza (vacío: una persona o ci-main-verde.sh)'
        required: false
        default: ''

concurrency:
  group: punta-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  # Para lanzar sobre-main.yml y relanzar las puntas que esperaban (workflow_dispatch con el GITHUB_TOKEN: es la excepción que sí
  # dispara otra corrida; un push hecho con él no dispara nada).
  actions: write

jobs:
  chequear-y-llevar:
    runs-on: ubuntu-latest
    # ⚠️ El tope del JOB, cuando se pasa, lo deja CANCELADO (así terminó el 30/10 la corrida de `integracion` que llegó a
    # los 30 min), y `if: failure()` no corre en un job cancelado: un cuelgue no dejaría la marca del rojo. Por eso los
    # dos pasos largos llevan su propio tope: ahí es un fallo del paso. Y por eso éste tiene que ser mayor que la suma de
    # los dos (30 + 18) más lo demás (~5 min: el checkout solo llegó a 139 s), o el job se corta antes que el paso.
    timeout-minutes: 55
    steps:
      # fetch-depth 0: `git merge` y tests-afectados necesitan el ancestro común con main.
      # ⚠️ En este archivo no se usa `--depth` en ningún fetch: un `git fetch --depth=1 origin main` vuelve el clon
      # superficial, main queda sin historia y la mezcla muere con «refusing to merge unrelated histories».
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Un rojo de sobre-main.yml lo lanza el bot y no le llega a nadie por mail: se dice acá, en la corrida de cada punta, que es lo
      # que mira cada chat. Nunca frena: es un aviso.
      - name: Main está rojo
        run: |
          if git ls-remote --exit-code origin refs/heads/ci-rojo/main >/dev/null 2>&1; then
            echo "::warning title=main está rojo::El chequeo sobre main dio rojo y sigue sin arreglarse: el despliegue diario está frenado hasta que vuelva a verde. Si esta punta da rojo puede ser por main: queda en espera-main y se relanza sola. Lo de main: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/sobre-main.yml"
          fi

      # ── QUÉ CAMBIÓ LA PUNTA, ANTES DE MEZCLAR ────────────────────────────────────────────────
      # Es la lista de referencia: después de mezclar, la diferencia con main tiene que salir de acá.
      #
      # ⚠️ Sin `|| true` ni `|| echo ''` en los git de este paso: «no pude calcular» tiene que ser rojo. Una lista
      # vacía por un error se leería como «no hay nada que chequear».
      #
      # ⚠️ EL AUTOR. La mezcla no puede salir firmada por github-actions[bot]: Vercel puede bloquear el despliegue de
      # un autor que no es del equipo, y main avanzaría sin que nada llegue a producción. Autor y committer de la
      # mezcla son los del último commit de la punta. Si ese commit ya es de un bot, se frena acá.
      #
      # ⚠️ `noreply@anthropic.com` TAMBIÉN SE FRENA (6/11/2026). Es con lo que firma la nube por default, y Vercel bloquea
      # esos deploys igual que los de un bot (build-deploy, 17/08). No se frenaba, y la mezcla de `punta/spy-busqueda` entró
      # a main firmada así (9202c22d2): main avanzó y a producción no llegó nada. El síntoma es el peor de todos — verde en
      # Actions, nada en producción — así que se frena ANTES de la mezcla, con el arreglo a la vista: volver a firmar el
      # commit con el correo del equipo. Contexto: docs/relevo/nube-ramas.md.
      - name: Lo que cambió la punta
        id: punta
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::No encuentro origin/main: no puedo calcular lo que cambió la punta."
            exit 1
          fi
          if ! base=$(git merge-base origin/main HEAD); then
            echo "::error::La punta no comparte historia con main: no puedo calcular lo que cambió."
            exit 1
          fi
          git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/punta-cambiados.txt"
          echo "La punta cambió $(wc -l < "$RUNNER_TEMP/punta-cambiados.txt") archivo(s) desde ${base}." | tee -a "$GITHUB_STEP_SUMMARY"

          nombre=$(git log -1 --format=%an HEAD)
          correo=$(git log -1 --format=%ae HEAD)
          if [ -z "$nombre" ] || [ -z "$correo" ]; then
            echo "::error::No pude leer el autor del último commit de la punta."
            exit 1
          fi
          case "$nombre $correo" in
            *'[bot]'*|*noreply@github.com*|*noreply@anthropic.com*)
              echo "::error::El último commit de la punta es de «$nombre <$correo>»: Vercel no despliega a ese autor, así que main avanzaría sin que nada llegue a producción. Volvé a firmar el commit con el correo del equipo (git commit --amend --author=…) y subí la punta otra vez."
              exit 1
              ;;
          esac
          echo "autor_nombre=$nombre" >> "$GITHUB_OUTPUT"
          echo "autor_correo=$correo" >> "$GITHUB_OUTPUT"

      # ── LAS BITÁCORAS SE UNEN SOLAS (4/11/2026; scripts/unir-bitacora.mjs) ─────────────────────────────────────
      # Dos puntas del mismo día agregan su hito al final de la MISMA app/admin/dev/<área>/bitacora.ts: para git es un
      # choque, y puntas verdes perdían «Llevar a main» por eso. El driver deja los dos hitos si cada lado sólo AGREGÓ
      # elementos completos en el mismo lugar; cualquier otro choque sigue siendo un choque. Se copia de MAIN (una punta
      # vieja todavía no lo tiene) y el atributo va a .git/info/attributes (su .gitattributes tampoco lo tiene). Vale para
      # las dos mezclas: la de acá abajo y la de «Llevar a main», que después corre las guardas (tsc-bitacoras incluido).
      # Y las reglas de mezcla de MAIN (las líneas `merge=` de su .gitattributes) valen también para una punta vieja que no
      # las tiene: sin eso, `docs/hallazgos*.md merge=union` no corría y punta/sobre-main chocó en el índice (4/11/2026).
      - name: Las bitácoras se unen solas al mezclar
        run: |
          attrs="$(git rev-parse --git-dir)/info/attributes"
          mkdir -p "$(dirname "$attrs")"
          git show origin/main:.gitattributes 2>/dev/null | grep -E '[[:space:]]merge=' >> "$attrs" || true
          driver="$RUNNER_TEMP/unir-bitacora.mjs"
          if ! git show origin/main:scripts/unir-bitacora.mjs > "$driver" 2>/dev/null && ! cp scripts/unir-bitacora.mjs "$driver" 2>/dev/null; then
            echo "::warning::Sin scripts/unir-bitacora.mjs: un choque en una bitácora queda como choque."
            exit 0
          fi
          git config merge.bitacora.name "las bitácoras: dos hitos al final, los dos"
          git config merge.bitacora.driver "node $driver %O %A %B %P"
          echo 'app/admin/dev/*/bitacora.ts merge=bitacora' >> "$attrs"

          # ── Y EL ÍNDICE DE HALLAZGOS SE UNE POR CELDA (6/11/2026; scripts/unir-indice-hallazgos.mjs) ───────────
          # `docs/hallazgos*.md merge=union` también agarraba el ÍNDICE, que es una tabla con una fila por área que cada
          # cosecha REESCRIBE: union dejaba las dos filas. 130 filas de más en main el 6/11. Mismo patrón que arriba.
          indice="$RUNNER_TEMP/unir-indice-hallazgos.mjs"
          if git show origin/main:scripts/unir-indice-hallazgos.mjs > "$indice" 2>/dev/null || cp scripts/unir-indice-hallazgos.mjs "$indice" 2>/dev/null; then
            git config merge.indice-hallazgos.name "el índice de hallazgos: una fila por área, las dos entradas"
            git config merge.indice-hallazgos.driver "node $indice %O %A %B %P"
            echo 'docs/hallazgos.md merge=indice-hallazgos' >> "$attrs"
          else
            echo "::warning::Sin scripts/unir-indice-hallazgos.mjs: un choque en el índice de hallazgos queda como choque."
          fi

      # ── MEZCLAR EL MAIN DE ESTE MOMENTO ──────────────────────────────────────────────────────
      # Lo que se chequea es lo que va a quedar en main, no la punta como salió de su chat.
      #
      # ⚠️ ANTES de `npm ci`: si main sumó una dependencia, instalar antes de mezclar deja el node_modules viejo y los
      # tests corren contra otra lista. Y un choque se ve a los ~20 s, sin pagar la instalación.
      #
      # ⚠️ QUÉ VE tests-afectados DESPUÉS DE MEZCLAR (comprobado en `leerCambios` y en tests/punta-ci.test.ts): con
      # `--base origin/main` hace `git merge-base origin/main HEAD` y compara ese commit contra el disco. Mezclado, el
      # ancestro ES origin/main, así que la lista es exactamente lo que la punta le agrega a main: no entra lo que
      # trajo main, y no entra lo de la punta que main ya tiene igual. Sólo queda vacía si el árbol es igual al de
      # main, y ese caso se corta acá (`nada`): no hay nada para chequear ni para llevar.
      #
      # `solo_docs` mira las DOS listas: lo que cambió la punta y lo que le queda de diferencia con main.
      # ⚠️ Y SÓLO LO QUE NO SE COMPILA NI SE EJECUTA: tsconfig.json incluye `**/*.ts`, así que un `docs/x.ts` entra al tsc y, sin
      # chequear, dejaría rojos los Tipos de todas las puntas que siguen; y docs/ ya tiene un `.mjs` y un `.js`. Una extensión que
      # no está en la lista corre todo.
      - name: Mezclar main en la punta
        id: mezcla
        env:
          GIT_AUTHOR_NAME: ${{ steps.punta.outputs.autor_nombre }}
          GIT_AUTHOR_EMAIL: ${{ steps.punta.outputs.autor_correo }}
          GIT_COMMITTER_NAME: ${{ steps.punta.outputs.autor_nombre }}
          GIT_COMMITTER_EMAIL: ${{ steps.punta.outputs.autor_correo }}
        run: |
          antes=$(git rev-parse HEAD)
          if ! git merge --no-edit -m "Merge origin/main en $GITHUB_REF_NAME" origin/main; then
            choques=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            git merge --abort || true
            echo "::error::La punta no se pudo mezclar con main. Archivos en choque: ${choques:-ninguno, mira el log de este paso}. No se chequeó nada. Mezcla origin/main en la punta, resuelve y vuelve a subir (el índice docs/hallazgos.md: python -I scripts/unir-indice-hallazgos.py .)."
            exit 1
          fi
          # La punta y main cambiaron el mismo workflow: GitHub no dejaría subir la mezcla (scripts/ci-workflow-nuevo.sh).
          sh scripts/ci-workflow-nuevo.sh "$antes"
          git diff --name-only --no-renames origin/main HEAD > "$RUNNER_TEMP/punta-neto.txt"
          if [ ! -s "$RUNNER_TEMP/punta-neto.txt" ]; then
            echo "nada=true" >> "$GITHUB_OUTPUT"
            echo "solo_docs=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El árbol de la punta es igual al de main: no hay nada para chequear ni para llevar."
            echo "La punta no le agrega nada a main: no se chequea ni se empuja." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "nada=false" >> "$GITHUB_OUTPUT"
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fuera=$(cat "$RUNNER_TEMP/punta-cambiados.txt" "$RUNNER_TEMP/punta-neto.txt" | { grep -Ev '^docs/.*\.(md|png|jpe?g|webp|gif|pdf|svg|txt|json|jsonl|html)$' || true; })
          # TEXTO (4/11/2026): lo de arriba más las bitácoras de /admin/dev, AGENTS.md y CLAUDE.md. No lleva tipos: las bitácoras las
          # chequea tsc-bitacoras en las guardas, y lo demás no compila. Los tests que leen esos archivos corren igual.
          fuera_texto=$(printf '%s\n' "$fuera" | { grep -Ev '^(app/admin/dev/[^/]+/bitacora\.ts|AGENTS\.md|CLAUDE\.md)?$' || true; })
          if [ -s "$RUNNER_TEMP/punta-cambiados.txt" ] && [ -z "$fuera" ]; then
            echo "solo_docs=true" >> "$GITHUB_OUTPUT"
            echo "texto=true" >> "$GITHUB_OUTPUT"
            echo "Sólo documentación: corren los tests que la leen, sin tipos, y main avanza igual." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -s "$RUNNER_TEMP/punta-cambiados.txt" ] && [ -z "$fuera_texto" ]; then
            echo "solo_docs=false" >> "$GITHUB_OUTPUT"
            echo "texto=true" >> "$GITHUB_OUTPUT"
            echo "Sólo texto (documentación, bitácoras, AGENTS.md): corren los tests que lo leen, sin el tsc entero." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "solo_docs=false" >> "$GITHUB_OUTPUT"
            echo "texto=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Le agrega a main $(wc -l < "$RUNNER_TEMP/punta-neto.txt") archivo(s)." | tee -a "$GITHUB_STEP_SUMMARY"

      # ── LO QUE YA SE PROBÓ (4/11/2026, scripts/veredicto.mjs) ─────────────────────────────────────────────
      # El de la nube viene en el commit; el de Actions, en la caché de ESTA rama (lo deja «Guardar lo que pasó», más abajo). Si
      # ninguno vale, `usar=false` y todo corre como siempre. Un error de este paso nunca frena la punta: corre todo.
      - name: El veredicto de la corrida anterior de esta punta
        if: steps.mezcla.outputs.nada != 'true' && steps.mezcla.outputs.texto != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/veredicto-previo.json
          key: veredicto-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: veredicto-${{ github.ref_name }}-

      - name: Lo que ya se probó
        id: veredicto
        if: steps.mezcla.outputs.nada != 'true' && steps.mezcla.outputs.texto != 'true'
        # Si Martín carga este secreto (y la misma variable en el entorno de la nube), un veredicto sin su firma no pasa. Sin él, pasa
        # y el resumen dice «sin firma»: ver la cabecera de scripts/veredicto.mjs.
        env:
          MAKO_VEREDICTO_CLAVE: ${{ secrets.MAKO_VEREDICTO_CLAVE }}
        run: |
          if ! node scripts/veredicto.mjs revisar --punta "$GITHUB_SHA" --main origin/main --salida "$RUNNER_TEMP/veredicto" --previo "$RUNNER_TEMP/veredicto-previo.json"; then
            echo "::warning::No pude revisar el veredicto: corre todo, como siempre."
            echo "usar=false" >> "$GITHUB_OUTPUT"
            echo "nada_que_repetir=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar
        id: instalar
        if: steps.mezcla.outputs.nada != 'true'
        run: npm ci --no-audit --no-fund

      - name: Tipos de las rutas
        if: steps.mezcla.outputs.nada != 'true'
        run: npx next typegen

      # ⚠️ Corren también en una punta de sólo docs, a diferencia de `integracion`: son ~10 s, y son lo único que ve una
      # clave pegada en un documento (claves-en-el-diff) o una referencia generada que quedó vieja (docs/api-mako.md).
      - name: Guardas del push
        id: guardas
        if: steps.mezcla.outputs.nada != 'true'
        run: sh scripts/guardas-push.sh origin

      # El tsc entero, con `scripts/tipos-ci.mjs`: 98 es «SIN MEMORIA / sin veredicto», y sale tal cual, rojo. TIPOS_TANDAS es
      # el respaldo si el entero muere por memoria, y su OK sale «OK PARCIAL» con un aviso (historia en `git log -- .github/workflows/integracion.yml`, borrado el 4/11/2026).
      # ⚠️ EL ENTERO NO MORÍA POR GRANDE: moría contra el tope de 6.144 MB, sin swap. Con 10 GB de swap y tope de 12.288 MB terminó en
      # 248 s, con 6.187 MB vivos y sin parcial (run 41779840011, 4/11/2026, n=1). Antes eran ~360 s de intento que muere más ~270 de
      # tandas, para un OK PARCIAL.
      # ⚠️ ANTES DE LOS TESTS, con la máquina recién prendida (4/11/2026): el mismo árbol de dash-cobranza no terminó en 18 min después de
      # 639 s de tests (corrida 180) y terminó en 456 s sin tests antes (corrida 188). El tsc pide ~7,4 GB de los 7,9 del runner: lo que
      # dejan los tests lo empuja al swap. Por eso además corta solo a los 14 min (TIPOS_TOPE_S) con «SIN TIEMPO», y la corrida se
      # relanza UNA vez («Relanzar si la máquina no llegó a los tipos», abajo): eso es la máquina, no el código del chat.
      # ⚠️ 6 GB, NO 10: el disco del runner tiene 11 GB libres y el runner ya trae 3,3 GB de swap. Con 10, después de los tests no quedó
      # lugar ni para el tsbuildinfo: `error TS5033 ... ENOSPC` se contó como un error de tipos, con el chequeo limpio (corrida 18). Y se
      # saca después del tsc («Sacar el swap de los tipos»): los tests corren con el disco entero, como antes.
      # ⚠️ Sin tipos acá: con sólo texto, y con un veredicto que ya los cubre sobre este contenido de la punta. Lo segundo llega a main
      # «sin probar» y sobre-main.yml corre el tsc entero sobre lo que quedó (scripts/veredicto.mjs → `sin_probar`).
      - name: Swap para los tipos
        if: "!cancelled() && steps.instalar.outcome == 'success' && steps.mezcla.outputs.texto != 'true' && steps.veredicto.outputs.tipos_saltear != 'true'"
        run: |
          sudo fallocate -l 6G /swapfile-tipos
          sudo chmod 600 /swapfile-tipos
          sudo mkswap /swapfile-tipos
          sudo swapon /swapfile-tipos

      - name: Tipos
        id: tipos
        if: "!cancelled() && steps.instalar.outcome == 'success' && steps.mezcla.outputs.texto != 'true' && steps.veredicto.outputs.tipos_saltear != 'true'"
        timeout-minutes: 18
        env:
          TIPOS_TANDAS: '4'
          TIPOS_HEAP_MB: '12288'
          # 14 min, por debajo de los 18 del paso: así corta el script, que dice «SIN TIEMPO» con la memoria de ese momento, y no
          # Actions, que mata el paso sin una línea (corrida 180). Lo normal es 2 a 8 min.
          TIPOS_TOPE_S: '840'
        run: |
          set +e
          echo "empezo=si" >> "$GITHUB_OUTPUT"
          echo "antes del tsc: $(free -m | awk '/Mem:/ {print $7}') MB disponibles, $(free -m | awk '/Swap:/ {print $3}') MB de swap usado"
          ps -eo pid,etime,pcpu,rss,args --sort=-pcpu | head -6 | cut -c1-160
          SECONDS=0
          node scripts/tipos-ci.mjs
          c=$?
          if [ "$c" = "97" ]; then echo "salida=sin-tiempo" >> "$GITHUB_OUTPUT"; else echo "salida=otra" >> "$GITHUB_OUTPUT"; fi
          echo "tipos: $SECONDS s (código $c)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $c

      # El swap era para el tsc: los tests corren con el disco entero (con 6 GB menos, un ENOSPC de un test se leería como su rojo).
      - name: Sacar el swap de los tipos
        if: "!cancelled() && steps.tipos.outputs.empezo == 'si'"
        # Si Actions cortó el paso, el tsc puede seguir vivo (huérfano, como en la corrida 180) y ocupando el swap: primero se lo para.
        run: |
          pkill -f 'node_modules/typescript/bin/tsc' || true
          sudo swapoff /swapfile-tipos && sudo rm -f /swapfile-tipos || echo "::warning::No pude sacar el swap de los tipos: los tests corren con 6 GB menos de disco."

      # ── LOS TESTS AFECTADOS, TODOS ───────────────────────────────────────────────────────────
      # ⚠️ SIN `--cortar`: un rojo muestra TODOS los rojos de la punta. El 3/11 cada error aparecía recién al arreglar el
      # anterior, y cada vuelta costó ~10 min. Acá no se ahorra nada cortando: la punta es chica y el rojo es sólo suyo.
      #
      # ⚠️ EN `integracion` EL CÓDIGO 2 («no pude calcular») ES `exit 0` PORQUE DESPUÉS CORRE EL RESTO. ACÁ NO HAY RESTO:
      # el 2 tiene que ser rojo, igual que el 99 («no corrió»).
      #
      # ⚠️ Y EL 0 SOLO NO ALCANZA. El script también sale con 0 cuando dice «Nada cambió» o «Ningún test mira lo cambiado».
      # A esta altura el árbol difiere de main (si no, `nada` ya lo cortó), así que eso sería un cálculo roto dando un
      # verde. Se exige la línea final del verde, con tests adentro.
      #
      # ⚠️ Corren aunque una guarda o los Tipos (que van antes, desde el 4/11/2026) hayan dado rojo (`!cancelled()`): un rojo muestra todo
      # lo que hay de una vez. «Llevar a main» no lleva esa condición: con cualquier paso rojo, se saltea.
      #
      # No se usa PIPESTATUS para que este paso corra igual en `sh` (lo prueba tests/punta-ci.test.ts).
      #
      # ⚠️ CON UN VEREDICTO (`USAR=true`) corren sólo los de `--solo`: lo que la mezcla pudo cambiar, lo que el veredicto no tenía en verde y
      # la muestra. Si no queda ninguno (`nada_que_repetir` = si), este paso no corre: corre el de abajo, que lo dice en el resumen. Así este paso no
      # tiene un `exit 0` por un costado.
      # ⚠️ CON SÓLO DOCUMENTACIÓN NO CORRE (6/11/2026, por los minutos: docs/hallazgos-infra.md → «Los minutos de GitHub Actions»): sólo
      # las guardas y la guarda de los mails reales (abajo), que es lo único que no se deshace. Las barredoras que leen docs/ las corre
      # el chequeo diario sobre main, antes del despliegue (y los docs no se despliegan). El costo, medido antes: un relevo que rompe una
      # barredora puede dejar roja la punta SIGUIENTE, de otro chat, hasta ese chequeo. Si una punta da rojo en algo que no tocó, se
      # lanza sobre-main.yml a mano.
      - name: Tests afectados por lo que cambió (todos, sin cortar)
        id: afectados
        # ⚠️ NUNCA una salida contra un número («cuantos != '0'»): una salida que falta es null, y GitHub compara null con un número
        # como 0. Sin veredicto este paso se salteaba entero (corridas 188 y 189, 4/11/2026). Lo fija tests/punta-condiciones.test.ts.
        if: "!cancelled() && steps.instalar.outcome == 'success' && steps.mezcla.outputs.solo_docs != 'true' && steps.veredicto.outputs.nada_que_repetir != 'si'"
        timeout-minutes: 30
        # El tiempo de cada archivo de test, al lado del reporte de siempre (scripts/reporter-tiempos.mjs). Lo lee el paso de abajo.
        env:
          MAKO_TIEMPOS_TESTS: ${{ runner.temp }}/tiempos-tests.tsv
          MAKO_VEREDICTO_CORRIDA: ${{ runner.temp }}/veredicto-corrida.json
          USAR: ${{ steps.veredicto.outputs.usar }}
          REPETIR: ${{ steps.veredicto.outputs.repetir }}
        run: |
          set +e
          echo "runner: $(nproc) CPU, $(free -m | awk '/Mem:/ {print $2}') MB de RAM"
          SECONDS=0
          solo=""
          if [ "$USAR" = "true" ]; then solo="--solo $REPETIR"; fi
          { node scripts/tests-afectados.mjs --base origin/main $solo --concurrencia auto --tanda 100 --compartir; echo $? > "$RUNNER_TEMP/afectados.codigo"; } 2>&1 | tee "$RUNNER_TEMP/afectados.log"
          c=$(cat "$RUNNER_TEMP/afectados.codigo")
          echo "afectados: $SECONDS s (código $c)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$c" = "2" ]; then echo "::error::No pude calcular los tests afectados (código 2): sin ese cálculo no hay verde."; exit 2; fi
          if [ "$c" != "0" ]; then exit "$c"; fi
          if ! grep -Eq 'VERDE · [1-9][0-9]* tests' "$RUNNER_TEMP/afectados.log"; then
            echo "::error::tests-afectados salió con 0 sin correr ningún test, y la punta sí difiere de main: eso no es un verde."
            exit 1
          fi

      # Un mail real de un dueño en docs/ llega a la historia de git y no se saca más: es la única barredora que no espera al chequeo
      # diario. ~15 s.
      - name: Sólo documentación, sin mails reales
        if: "!cancelled() && steps.instalar.outcome == 'success' && steps.mezcla.outputs.solo_docs == 'true'"
        run: |
          echo "Sólo documentación: corren las guardas y la de los mails reales; las barredoras, en el chequeo diario sobre main." | tee -a "$GITHUB_STEP_SUMMARY"
          node --import tsx --test tests/sin-mails-reales.test.ts

      - name: Los tests los cubre el veredicto
        if: "!cancelled() && steps.instalar.outcome == 'success' && steps.veredicto.outputs.usar == 'true' && steps.veredicto.outputs.nada_que_repetir == 'si'"
        run: |
          echo "El veredicto cubre los tests de este mismo árbol: no se repite ninguno." | tee -a "$GITHUB_STEP_SUMMARY"
          printf '{"corridos":[],"noVerdes":[]}' > "$RUNNER_TEMP/veredicto-corrida.json"

      # Cuánto tardó cada archivo de test, en el resumen del run (4/11/2026). Para sacar un test de la fase que frena se mide
      # ACÁ, en el runner, no en la PC: ver LENTOS_FUERA_DE_LA_FASE_RAPIDA en tests-afectados.mjs. Nunca da rojo: es un dato.
      - name: Tiempo por archivo de test
        if: "!cancelled() && steps.instalar.outcome == 'success'"
        run: node scripts/tiempos-tests.mjs "$RUNNER_TEMP/tiempos-tests.tsv" --top 15 >> "$GITHUB_STEP_SUMMARY" || true

      # ── LO QUE PASÓ QUEDA PARA LA PRÓXIMA SUBIDA DE ESTA PUNTA (scripts/veredicto.mjs guardar) ─────────────────
      # Con rojo también: al arreglar un test, la próxima corrida no repite los cientos que ya pasaron y nada tocó. Va antes de llevar a
      # main porque mira ESTE árbol, y «Llevar» puede volver a mezclar. Nunca da rojo.
      - name: Guardar lo que pasó
        id: guardar
        if: "!cancelled() && steps.instalar.outcome == 'success' && steps.mezcla.outputs.texto != 'true'"
        env:
          TIPOS: ${{ steps.tipos.outcome }}
          MAIN_SHA: ${{ steps.mezcla.outputs.main_sha }}
        run: |
          t=no
          if [ "$TIPOS" = "success" ]; then t=ok; fi
          if node scripts/veredicto.mjs guardar --punta "$GITHUB_SHA" --main "$MAIN_SHA" --corrida "$RUNNER_TEMP/veredicto-corrida.json" --tipos "$t" --salida "$RUNNER_TEMP/veredicto-previo.json" && [ -s "$RUNNER_TEMP/veredicto-previo.json" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No quedó el veredicto de esta corrida: la próxima subida de la punta corre todo."
          fi

      - name: Guardar el veredicto en la caché de la rama
        if: "!cancelled() && steps.guardar.outputs.hay == 'true'"
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/veredicto-previo.json
          key: veredicto-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      # ── SI LA MÁQUINA NO LLEGÓ A LOS TIPOS, SE RELANZA UNA VEZ (4/11/2026; el Cerebro: «que un tope de tiempo no se lea como rojo del
      # chat: que se reintente una vez o avise como corrida fallida de la máquina») ─────────────────────────────────────────────────
      # Sólo si el tsc no terminó a tiempo (97, «SIN TIEMPO», o el paso cortado por Actions sin salida) y lo demás no dio rojo: un rojo de
      # las guardas o de los tests es del código y se dice como siempre. La corrida relanzada lleva `relanzo=maquina` y no se vuelve a
      # relanzar. Usa el veredicto que esta corrida acaba de guardar: no repite los tests que ya pasaron. La marca ci-rojo no se deja.
      # ⚠️ La corrida nueva cancela a ésta (concurrency): va al final, después de guardar, y queda «cancelled», no roja.
      - name: Relanzar si la máquina no llegó a los tipos
        id: relanzar
        if: >-
          failure() && steps.tipos.outputs.empezo == 'si' && steps.tipos.outputs.salida != 'otra'
          && steps.guardas.outcome == 'success' && steps.afectados.outcome != 'failure'
          && github.event.inputs.relanzo != 'maquina'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh workflow run punta.yml --ref "$GITHUB_REF_NAME" -f relanzo=maquina; then
            echo "relanzada=si" >> "$GITHUB_OUTPUT"
            echo "::warning title=Tipos: la máquina no llegó (no es el código)::El tsc no terminó a tiempo en este runner. La corrida se relanzó una vez, en una máquina nueva y sin repetir los tests que ya pasaron. No hay nada que corregir en la punta."
            echo "La máquina no llegó a los tipos: se relanzó una vez. No es un rojo de la punta." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No pude relanzar la corrida: queda roja, pero los tipos no dieron error (SIN TIEMPO). Volvé a subir la punta tal cual."
          fi

      # ── LLEVAR A MAIN ────────────────────────────────────────────────────────────────────────
      # Sin `--force`: un push rechazado no pisa nada. Si otra punta llegó mientras corrían los tests, se mezcla el main
      # nuevo y se vuelve a intentar, hasta 5 veces. Si choca, rojo.
      #
      # ⚠️ LO QUE ESTE BUCLE NO COMPRUEBA: después de una mezcla de acá, sólo se repiten las guardas (~10 s). Los tests y
      # los tipos corrieron contra el main anterior: dos puntas que no chocan como texto pueden romperse entre sí. Lo
      # caza la corrida de la punta siguiente (mezcla ese main y corre tipos) y el semanal. El bucle lo avisa con un
      # ::warning::, para que no se lea como un chequeo entero.
      #
      # ⚠️ Un primer push que TRAE punta.yml: el 2/11 (corridas 372 y 377) el GITHUB_TOKEN llevó a main cambios de un
      # workflow por fast-forward, y se aceptó. Una mezcla NUEVA hecha acá con un workflow distinto del de main no está
      # medida: si GitHub la rechaza, el bucle agota sus 5 intentos y sale rojo, sin tocar main.
      - name: Llevar a main (sin forzar)
        id: llevar
        if: steps.mezcla.outputs.nada != 'true'
        env:
          GIT_AUTHOR_NAME: ${{ steps.punta.outputs.autor_nombre }}
          GIT_AUTHOR_EMAIL: ${{ steps.punta.outputs.autor_correo }}
          GIT_COMMITTER_NAME: ${{ steps.punta.outputs.autor_nombre }}
          GIT_COMMITTER_EMAIL: ${{ steps.punta.outputs.autor_correo }}
          # Los tipos no corrieron acá porque los cubría un veredicto: lo que llega a main lo mira sobre-main.yml.
          SIN_PROBAR_VEREDICTO: ${{ steps.veredicto.outputs.sin_probar }}
          # Con sólo texto no corrió el tsc entero (y con sólo docs, ni los tests): lo que llega no puede devolver main a verde.
          TEXTO: ${{ steps.mezcla.outputs.texto }}
        run: |
          for intento in 1 2 3 4 5; do
            if ! git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main; then
              echo "::warning::Intento ${intento}: no pude leer main."
              sleep $((intento * 5))
              continue
            fi
            if ! git merge-base --is-ancestor origin/main HEAD; then
              antes=$(git rev-parse HEAD)
              if ! git merge --no-edit -m "Merge origin/main en $GITHUB_REF_NAME" origin/main; then
                choques=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
                git merge --abort || true
                echo "::error::Mientras corrían los tests main se movió, y ahora la punta choca en: ${choques}. Mezcla origin/main en la punta, resuelve y vuelve a subir."
                exit 1
              fi
              echo "::warning::main se movió durante los tests: esta mezcla pasó por las guardas, no por los tests ni los tipos."
              sh scripts/ci-workflow-nuevo.sh "$antes" || exit 1
              sh scripts/guardas-push.sh origin || exit 1
              mezclo=1
            fi
            if git push origin "HEAD:refs/heads/main"; then
              echo "main avanzó a $(git rev-parse --short HEAD)." | tee -a "$GITHUB_STEP_SUMMARY"
              sp=${mezclo:-0}
              if [ "$SIN_PROBAR_VEREDICTO" = "1" ]; then sp=1; fi
              if [ "$TEXTO" = "true" ]; then sp=1; fi
              echo "sin_probar=$sp" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Intento ${intento}: main rechazó el push."
            sleep $((intento * 5))
          done
          echo "::error::Después de 5 intentos no pude llevar la punta a main: no se forzó nada."
          exit 1

      # ── MAIN DESPUÉS DE ESTA PUNTA (4/11/2026, sobre-main.yml) ─────────────────────────────────────────────────────
      # · Si lo que llegó a main es una mezcla que NO se probó (main se movió durante los tests): la mira el chequeo DIARIO sobre main
      #   (sobre-main.yml, 09:47 UTC), antes del despliegue de las 11:05. ⚠️ Hasta el 6/11/2026 se lanzaba acá, una corrida por mezcla:
      #   126 corridas y 1.437 min en seis días. Producción compila una vez por día, así que alcanza con mirar ese main.
      # · Si llegó lo mismo que se probó y main estaba marcado rojo (`ci-rojo/main`): este árbol acaba de pasar tipos y barredoras,
      #   o sea que main volvió a verde. ci-main-verde.sh borra la marca y relanza las puntas que dieron rojo mientras tanto.
      # Ninguno de los dos pone rojo este verde: lanzar y relanzar son favores.
      - name: Main después de esta punta
        if: steps.llevar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIN_PROBAR: ${{ steps.llevar.outputs.sin_probar }}
        run: |
          if [ "$SIN_PROBAR" = "1" ]; then
            echo "La mezcla que llegó a main no pasó por los tests: la mira el chequeo diario sobre main, antes del despliegue." | tee -a "$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code origin refs/heads/ci-rojo/main >/dev/null 2>&1; then
            sh scripts/ci-main-verde.sh origin
          fi
          exit 0

      # El verde borra la marca de un rojo anterior de esta punta: una marca vieja se leería como un rojo vigente.
      - name: Borrar la marca de un rojo anterior
        run: |
          punta="${GITHUB_REF_NAME#punta/}"
          if git ls-remote --exit-code origin "refs/heads/ci-rojo/$punta" >/dev/null; then
            git push origin --delete "refs/heads/ci-rojo/$punta" || echo "::warning::No pude borrar la marca vieja ci-rojo/$punta."
          fi

      # ── EL ROJO SE ANUNCIA EN GIT, IGUAL QUE EL VERDE (Martín, 2/11/2026; el porqué, en el historial de integracion.yml) ────
      # Una rama POR PUNTA, y nunca en main: un rojo de una punta no puede pisar la marca de otra. Apunta al commit que se
      # subió ($GITHUB_SHA) y no a HEAD: acá HEAD puede ser una mezcla que no existe en ningún otro lado.
      # `if: failure()` y no `always()`: si no, un verde también movería la marca.
      - name: Dejar la marca del rojo en ci-rojo/<punta>
        if: failure() && steps.relanzar.outputs.relanzada != 'si'
        run: |
          punta="${GITHUB_REF_NAME#punta/}"
          git push origin --force "$GITHUB_SHA:refs/heads/ci-rojo/$punta"
          echo "::notice::Marca dejada en origin/ci-rojo/$punta → $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Con main rojo, este rojo puede no ser de la punta: queda esperando, y ci-main-verde.sh la relanza cuando main vuelva a verde.
          if git ls-remote --exit-code origin refs/heads/ci-rojo/main >/dev/null 2>&1; then
            git push origin --force "$GITHUB_SHA:refs/heads/espera-main/$punta" || true
            echo "::notice::main está rojo: si este rojo es por main, la punta se relanza sola cuando main vuelva a verde."
          fi
