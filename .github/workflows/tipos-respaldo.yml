# =============================================================================
# El tsc ENTERO, CADA NOCHE si entró algo a main: el respaldo de las tandas (decidido el 21/10/2026; diario desde el 4/11)
# =============================================================================
# ⚠️ 4/11/2026: pasa de semanal a CADA NOCHE (docs/hallazgos-infra.md → «Por qué tardaba horas»), con el mismo primer paso que
# semanal-tests.yml: si main no se movió desde el último veredicto, no corre (1 minuto facturado). Medido: ~5 min con swap (run
# 41779840011: 248 s el tsc, 6.187 MB vivos). Desde el 4/11 cada punta ya corre el tsc ENTERO (OK PARCIAL sólo si muere por
# memoria): esto es la red de esos parciales y de lo que llega a main sin pasar por una punta. 36 h sin veredicto con commits
# nuevos = rojo del vigía de despues-del-deploy.yml. Lo de abajo es la historia de cuando era semanal.
#
# Por qué: el paso «Tipos» de `integracion` reparte el chequeo en tandas (TIPOS_TANDAS=4) para entrar en la RAM del runner, y las tandas NO son «lo mismo que el tsc» en todos los casos. El checker cachea
# algunos errores (TS2589 una instanciación profunda, TS2303 un alias circular) y los atribuye al primer archivo que los dispara; si ese es de OTRA tanda se perdían y el paso decía «OK» donde el tsc da exit 2
# (revisión del 21/10/2026, dos repros de 8 archivos). Repartir en el orden del programa lo evita en esas repros, pero con un ciclo de imports que cruce tandas puede volver a pasar. Y Vercel tiene
# `typescript.ignoreBuildErrors: true`: nada más chequea tipos antes de producción. Sólo el tsc entero lo garantiza, y no entra en la RAM del runner en cada push (5 GB vivos, ~1 GB más por semana).
#
# Cómo entra: el tsc de siempre (tipos-ci.mjs, SIN TIPOS_TANDAS) con 10 GB de swap en el runner y el tope de heap en 12 GB: más lento que en un runner grande (los runners grandes no existen en una
# cuenta Free) pero entra, y una vez por semana nadie lo espera. Un rojo acá NO frena nada: avisa. Si da errores de tipos y `integracion` dio verde, las tandas perdieron algo: eso es lo que busca.
#
# ⚠️ MINUTOS (cuenta Free: 2.000 por mes y sin medio de pago). Lo que lo mantiene barato, como semanal-tests.yml:
#   · UNA corrida por semana (lunes 07:47 UTC = 04:47 AR), nunca por push ni por pull request;
#   · si en la semana no entró NINGÚN commit a main, no hace nada (el primer paso lo mira con la API en segundos: se factura 1 minuto);
#   · `timeout-minutes: 30` es el techo duro: 30 × 5 lunes = 150 min como mucho; lo esperado son ~12 min por corrida, ~50 al mes (2,5 %).
# A mano (workflow_dispatch) corre siempre: sirve para chequear antes de un cambio grande de tipos, o para medir cuánto tarda con swap la primera vez.
#
# GitHub manda el mail de un run que falló a quien editó este archivo por última vez; el resumen del run trae la línea TIPOS-MEDIDA.
# =============================================================================
name: tipos entero (respaldo de cada noche)

on:
  schedule:
    # Todos los días 07:47 UTC = 04:47 AR, un rato después de semanal-tests.yml (07:17): no corren pegados. Un minuto "raro" a propósito.
    - cron: '47 7 * * *'
  workflow_dispatch:

concurrency:
  group: tipos-respaldo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tipos-entero:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Antes de gastar nada: ¿entró algo a main desde el último VEREDICTO de este workflow? (el mismo paso que semanal-tests.yml)
      - name: ¿Hubo cambios desde el último veredicto?
        id: cambios
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          WF: tipos-respaldo.yml
        run: |
          main=$(gh api "repos/$REPO/commits/main" --jq .sha 2>/dev/null || true)
          ultimo=$(gh api "repos/$REPO/actions/workflows/$WF/runs?status=completed&per_page=30" --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // ""' 2>/dev/null || true)
          if [ "$EVENTO" != "workflow_dispatch" ] && [ -n "$main" ] && [ "$main" = "$ultimo" ]; then
            echo "correr=no" >> "$GITHUB_OUTPUT"
            echo "main sigue en $main, el último commit que se juzgó: no se corre." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "correr=si" >> "$GITHUB_OUTPUT"
            echo "main en ${main:-?} · último veredicto en ${ultimo:-ninguno} · evento $EVENTO: corre." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Sin `ref: main`: el commit del disparo queda como head_sha, y es contra ése que compara el primer paso la noche siguiente.
      - uses: actions/checkout@v4
        if: steps.cambios.outputs.correr == 'si'

      - uses: actions/setup-node@v4
        if: steps.cambios.outputs.correr == 'si'
        with:
          node-version: 24
          cache: npm

      - name: Instalar
        if: steps.cambios.outputs.correr == 'si'
        run: npm ci --no-audit --no-fund

      # Igual que punta.yml: tsc ve los tipos de las rutas que deja `.next/` y el next-env.d.ts, que están en .gitignore.
      - name: Tipos de las rutas
        if: steps.cambios.outputs.correr == 'si'
        run: npx next typegen

      # El tsc entero pide ~5 GB vivos (y V8 deja crecer el heap por encima): en un runner de 7,9 GB la parte de más va a swap. Sin swap el paso moriría por memoria (MATADO / SIN MEMORIA).
      # ⚠️ NO `/swapfile`: el runner ya trae ese archivo, en uso, y `fallocate` muere con «Text file busy». Así murió el 2/11 (el 26/10 no
      # había minutos): este flujo nunca dio un veredicto, y «Tipos» viene saliendo OK PARCIAL contando con él.
      - name: Swap de 6 GB
        if: steps.cambios.outputs.correr == 'si'
        run: |
          df -h /
          sudo fallocate -l 6G /swapfile-tipos
          sudo chmod 600 /swapfile-tipos
          sudo mkswap /swapfile-tipos
          sudo swapon /swapfile-tipos
          free -m

      # SIN TIPOS_TANDAS: es el tsc entero, que es lo que se quiere (el entero también corre en cada subida mientras entre en la RAM del runner; este es la garantía cuando no entra y «Tipos» sale «OK PARCIAL»). TIPOS_HEAP_MB sube el tope de heap por encima de la RAM porque hay swap.
      - name: Tipos (el tsc entero)
        if: steps.cambios.outputs.correr == 'si'
        # Menor que el del job: si no entra, es un FALLO del paso, no un job cancelado sin veredicto.
        timeout-minutes: 27
        env:
          TIPOS_HEAP_MB: '12288'
        run: |
          set +e
          SECONDS=0
          node scripts/tipos-ci.mjs
          c=$?
          echo "tipos (respaldo, tsc entero): $SECONDS s (código $c)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $c
