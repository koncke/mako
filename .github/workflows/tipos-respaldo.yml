# =============================================================================
# El tsc ENTERO, una vez por semana: el respaldo de las tandas (decidido el 21/10/2026)
# =============================================================================
# Por qué: el paso «Tipos» de `integracion` reparte el chequeo en tandas (TIPOS_TANDAS=4) para entrar en la RAM del runner, y las tandas NO son «lo mismo que el tsc» en todos los casos. El checker cachea
# algunos errores (TS2589 una instanciación profunda, TS2303 un alias circular) y los atribuye al primer archivo que los dispara; si ese es de OTRA tanda se perdían y el paso decía «OK» donde el tsc da exit 2
# (revisión del 21/10/2026, dos repros de 8 archivos). Repartir en el orden del programa lo evita en esas repros, pero con un ciclo de imports que cruce tandas puede volver a pasar. Y Vercel tiene
# `typescript.ignoreBuildErrors: true`: nada más chequea tipos antes de producción. Sólo el tsc entero lo garantiza, y no entra en la RAM del runner en cada push (5 GB vivos, ~1 GB más por semana).
#
# Cómo entra: el tsc de siempre (tipos-ci.mjs, SIN TIPOS_TANDAS) con 10 GB de swap en el runner y el tope de heap en 12 GB: más lento que en un runner grande (los runners grandes no existen en una
# cuenta Free) pero entra, y una vez por semana nadie lo espera. Un rojo acá NO frena nada: avisa. Si da errores de tipos y `integracion` dio verde, las tandas perdieron algo: eso es lo que busca.
#
# ⚠️ MINUTOS (cuenta Free: 2.000 por mes y sin medio de pago). Lo que lo mantiene barato, como semanal-tests.yml:
#   · UNA corrida por semana (lunes 07:47 UTC = 04:47 AR), nunca por push ni por pull request;
#   · si en la semana no entró NINGÚN commit a main, no hace nada (el primer paso lo mira con la API en segundos: se factura 1 minuto);
#   · `timeout-minutes: 30` es el techo duro: 30 × 5 lunes = 150 min como mucho; lo esperado son ~12 min por corrida, ~50 al mes (2,5 %).
# A mano (workflow_dispatch) corre siempre: sirve para chequear antes de un cambio grande de tipos, o para medir cuánto tarda con swap la primera vez.
#
# GitHub manda el mail de un run que falló a quien editó este archivo por última vez; el resumen del run trae la línea TIPOS-MEDIDA.
# =============================================================================
name: tipos entero (respaldo semanal)

on:
  schedule:
    # Lunes 07:47 UTC = 04:47 AR, un rato después de semanal-tests.yml (07:17): no corren pegados. Un minuto "raro" a propósito.
    - cron: '47 7 * * 1'
  workflow_dispatch:

concurrency:
  group: tipos-respaldo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tipos-entero:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Antes de gastar nada: ¿entró algo a main desde la última vez? A mano (workflow_dispatch) corre siempre.
      - name: ¿Hubo cambios en la semana?
        id: cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desde=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)
          nuevos=$(gh api "repos/${{ github.repository }}/commits?sha=main&since=${desde}&per_page=1" --jq 'length')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${nuevos}" != "0" ]; then
            echo "correr=si" >> "$GITHUB_OUTPUT"
          else
            echo "correr=no" >> "$GITHUB_OUTPUT"
            echo "Sin commits en main desde ${desde}: no se corre el tsc entero." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.cambios.outputs.correr == 'si'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.cambios.outputs.correr == 'si'
        with:
          node-version: 24
          cache: npm

      - name: Instalar
        if: steps.cambios.outputs.correr == 'si'
        run: npm ci --no-audit --no-fund

      # Igual que integracion.yml: tsc ve los tipos de las rutas que deja `.next/` y el next-env.d.ts, que están en .gitignore.
      - name: Tipos de las rutas
        if: steps.cambios.outputs.correr == 'si'
        run: npx next typegen

      # El tsc entero pide ~5 GB vivos (y V8 deja crecer el heap por encima): en un runner de 7,9 GB la parte de más va a swap. Sin swap el paso moriría por memoria (MATADO / SIN MEMORIA).
      - name: Swap de 10 GB
        if: steps.cambios.outputs.correr == 'si'
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -m

      # SIN TIPOS_TANDAS: es el tsc entero, que es lo que se quiere (el de las tandas ya corre en cada subida). TIPOS_HEAP_MB sube el tope de heap por encima de la RAM porque hay swap.
      - name: Tipos (el tsc entero)
        if: steps.cambios.outputs.correr == 'si'
        env:
          TIPOS_HEAP_MB: '12288'
        run: |
          set +e
          SECONDS=0
          node scripts/tipos-ci.mjs
          c=$?
          echo "tipos (respaldo, tsc entero): $SECONDS s (código $c)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $c
